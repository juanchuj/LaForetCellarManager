/* Build list of pieces that need weighing across all active batches.
   Only pieces in a batch whose Secado stage has actually started (startedAt <= now)
   AND is not done. Pieces in earlier stages (Curado, Fermentado, etc.) don't need
   routine weighing — their weight isn't the control variable yet. */
function piecesNeedingWeighing(){
  const list = [];
  const now = Date.now();
  db.batches.filter(b=>b.status==='in_progress').forEach(b=>{
    const sec = findSecadoStage(b);
    if(!sec || !sec.startedAt) return;
    if(new Date(sec.startedAt).getTime() > now) return; // Secado hasn't started yet
    if(sec.done) return;
    b.pieces.forEach(p=>{
      const logs = (p.weightLogs||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
      const latest = logs[0];
      const daysSince = latest ? Math.floor((Date.now() - new Date(latest.date).getTime())/(1000*60*60*24)) : 999;
      const safety = safetyStatus(b, p);
      if(safety.ready) return; // already finished → no need to weigh
      list.push({ batchId: b.id, pieceId: p.id, code: p.code, batchRef: b.ref, typeName: b.typeName,
                  latest: latest?latest.weight:p.initialWeight,
                  target: pieceTargetWeight(b, p),
                  daysSince, aw: safety.aw });
    });
  });
  list.sort((a,b)=> b.daysSince - a.daysSince);
  return list;
}

function openWeighSession(){
  const list = piecesNeedingWeighing();
  if(list.length === 0){ toast('No hay piezas pendientes de pesaje'); return; }
  window._weighSession = { list, idx: 0, startedAt: new Date().toISOString(), count: 0 };
  renderWeighSession();
}

function renderWeighSession(){
  const ws = window._weighSession;
  if(!ws) return;
  if(ws.idx >= ws.list.length){
    closeModal();
    toast(`Jornada completada: ${ws.count} pieza${ws.count===1?'':'s'} pesada${ws.count===1?'':'s'}`);
    render();
    return;
  }
  const item = ws.list[ws.idx];
  const b = db.batches.find(x=>x.id===item.batchId);
  const p = b.pieces.find(x=>x.id===item.pieceId);
  const safety = safetyStatus(b, p);
  showModal(`
    <div class="modal">
      <div class="modal-head">
        <h2>Jornada · <span class="mono" style="color:var(--muted);font-size:14px">${ws.idx+1} / ${ws.list.length}</span></h2>
        <button class="btn ghost" onclick="closeModal()">✕ Salir</button>
      </div>
      <div style="text-align:center;padding:14px 0 10px">
        <div class="mono" style="font-size:28px;color:var(--brand);letter-spacing:0.05em">${item.code}</div>
        <div class="tiny" style="margin-top:4px">${item.batchRef} · ${item.typeName}</div>
      </div>
      <div class="grid grid-3" style="gap:10px;margin-bottom:14px;text-align:center">
        <div><div class="tiny">Último</div><div class="mono" style="font-size:16px">${fmtGExact(item.latest)}</div><div class="tiny">${item.daysSince<999?item.daysSince+'d ago':'nunca'}</div></div>
        <div><div class="tiny">Objetivo</div><div class="mono" style="font-size:16px;color:var(--brand)">${fmtGExact(item.target)}</div></div>
        <div><div class="tiny">aw actual</div><div class="mono" style="font-size:16px;color:${safety.level==='green'?'var(--sage)':safety.level==='red'?'var(--rust)':'var(--amber)'}">${safety.aw?safety.aw.toFixed(3):'—'}</div></div>
      </div>
      <div style="margin-bottom:10px"><label>Peso ahora (g)</label>
        <input type="number" step="1" id="ws-weight" placeholder="ingresa peso" style="font-size:22px;height:50px;text-align:center" onkeydown="if(event.key==='Enter'){event.preventDefault();weighSessionAdvance(false);}">
      </div>
      <div class="row" style="gap:8px">
        <button class="btn ghost" onclick="weighSessionAdvance(true)">Saltar →</button>
        <span class="spacer"></span>
        <button class="btn primary" onclick="weighSessionAdvance(false)">Guardar y Siguiente ↵</button>
      </div>
      <div class="tiny" style="text-align:center;margin-top:10px;color:var(--muted)">Enter avanza · Esc sale</div>
    </div>
  `);
  setTimeout(()=>{ const el = document.getElementById('ws-weight'); if(el) el.focus(); }, 50);
}

function weighSessionAdvance(skip){
  const ws = window._weighSession;
  if(!ws) return;
  const item = ws.list[ws.idx];
  if(!skip){
    const el = document.getElementById('ws-weight');
    const w = +el.value;
    if(w > 0){
      const b = db.batches.find(x=>x.id===item.batchId);
      const p = b.pieces.find(x=>x.id===item.pieceId);
      const dateISO = new Date().toISOString();
      const sus = isWeightSuspicious(p, w, dateISO);
      p.weightLogs = p.weightLogs || [];
      p.weightLogs.push({
        id: uid('wl'), date: dateISO, weight: w,
        note: 'jornada',
        suspicious: sus ? sus.kind : undefined
      });
      ws.count++;
      saveDB();
    } else {
      toast('Ingresa un peso o pulsa Saltar');
      return;
    }
  }
  ws.idx++;
  renderWeighSession();
}

function addEnvLog(batchId){
  const b = db.batches.find(x=>x.id===batchId);
  if(!b) return;
  const dateIn = document.getElementById('env-date').value;
  const t = document.getElementById('env-t').value;
  const hr = document.getElementById('env-hr').value;
  const stage = document.getElementById('env-stage').value;
  if(!dateIn || (!t && !hr)){ toast('Faltan datos'); return; }
  if(!b.envLog) b.envLog = [];
  b.envLog.push({
    id: uid('env'),
    date: new Date(dateIn).toISOString(),
    tempC: t===''?null:+t,
    hr: hr===''?null:+hr,
    stageKind: stage||null
  });
  saveDB();
  openEnvLogModal(batchId); // refresh
}

function removeEnvLog(batchId, logId){
  const b = db.batches.find(x=>x.id===batchId);
  if(!b || !b.envLog) return;
  b.envLog = b.envLog.filter(l=>l.id!==logId);
  saveDB();
  openEnvLogModal(batchId);
}

function importGoveeCsv(event, batchId){
  const file = event.target.files[0];
  if(!file) return;
  const b = db.batches.find(x=>x.id===batchId);
  if(!b) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const text = e.target.result;
      const lines = text.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length < 2){ toast('CSV vacío'); return; }
      // Autodetect columns: Govee exports usually have Timestamp, Temperature, Humidity
      const header = lines[0].toLowerCase();
      const cols = header.split(',');
      const idxT = cols.findIndex(c=>c.includes('temp'));
      const idxH = cols.findIndex(c=>c.includes('humid'));
      const idxDate = cols.findIndex(c=>c.includes('time') || c.includes('date'));
      if(idxDate<0 || (idxT<0 && idxH<0)){ toast('No reconozco el formato del CSV'); return; }
      if(!b.envLog) b.envLog = [];
      let added = 0;
      lines.slice(1).forEach(line=>{
        const parts = line.split(',');
        const dateStr = parts[idxDate]?.trim();
        if(!dateStr) return;
        const d = new Date(dateStr);
        if(isNaN(d.getTime())) return;
        b.envLog.push({
          id: uid('env'),
          date: d.toISOString(),
          tempC: idxT>=0 && parts[idxT] ? +parts[idxT] : null,
          hr: idxH>=0 && parts[idxH] ? +parts[idxH] : null,
          stageKind: null,
          source: 'govee-csv'
        });
        added++;
      });
      saveDB();
      toast(`${added} registros importados`);
      openEnvLogModal(batchId);
    }catch(err){ toast('Error leyendo CSV: '+err.message); }
  };
  reader.readAsText(file);
}

function renderEnvSummary(b){
  if(!b.envLog || b.envLog.length===0) return '';
  const ts = b.envLog.map(l=>l.tempC).filter(v=>v!==null && !isNaN(v));
  const hs = b.envLog.map(l=>l.hr).filter(v=>v!==null && !isNaN(v));
  const avg = arr => arr.length ? arr.reduce((s,v)=>s+v,0)/arr.length : null;
  const avgT = avg(ts), avgH = avg(hs);
  return `<span class="tiny">Media: T ${avgT!==null?avgT.toFixed(1)+'°C':'—'} · HR ${avgH!==null?Math.round(avgH)+'%':'—'}</span>`;
}

function openSafeDeleteModal({kind, label, details, warning, onConfirm}){
  // Clear any previous timer
  if(window._safeDeleteTimer){ clearInterval(window._safeDeleteTimer); window._safeDeleteTimer = null; }
  window._safeDeleteState = {
    kind, label, details, warning, onConfirm,
    countdown: 5,
    captchaOK: false
  };
  renderSafeDeleteModal();
  // Start countdown
  window._safeDeleteTimer = setInterval(()=>{
    const s = window._safeDeleteState;
    if(!s){ clearInterval(window._safeDeleteTimer); window._safeDeleteTimer = null; return; }
    s.countdown = Math.max(0, s.countdown - 1);
    updateSafeDeleteCountdown();
    if(s.countdown === 0){
      clearInterval(window._safeDeleteTimer);
      window._safeDeleteTimer = null;
    }
  }, 1000);
}

function renderSafeDeleteModal(){
  const s = window._safeDeleteState;
  if(!s) return;
  showModal(`
    <div class="modal" style="max-width:520px">
      <div class="modal-head">
        <h2 style="color:var(--rust)">⚠ Eliminación permanente</h2>
        <button class="btn ghost" onclick="closeSafeDelete()">✕</button>
      </div>

      <div style="background:rgba(167,94,58,0.08);border:1px solid var(--rust);border-left:3px solid var(--rust);border-radius:4px;padding:14px 16px;margin-bottom:14px">

        <div style="font-size:16px;font-weight:600;color:var(--brand);font-family:'JetBrains Mono',monospace;margin:4px 0">${escapeHtml(s.label)}</div>
        <div class="tiny" style="color:var(--ink-2);margin-top:6px">Contiene: ${escapeHtml(s.details)}</div>
      </div>

      <div style="background:var(--bg-2);border:1px dashed var(--line);border-radius:4px;padding:10px 14px;margin-bottom:14px">
        <div class="tiny" style="color:var(--amber)">${escapeHtml(s.warning)}</div>
      </div>

      <div style="margin-bottom:12px">
        <label class="tiny">Para confirmar, escribí la palabra <b style="color:var(--rust);font-family:'JetBrains Mono',monospace">ELIMINAR</b> en el campo:</label>
        <input type="text" id="safe-del-captcha" placeholder="ELIMINAR"
               oninput="checkSafeDeleteCaptcha(this.value)"
               autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
               style="width:100%;font-family:'JetBrains Mono',monospace;letter-spacing:0.08em;text-transform:uppercase">
      </div>

      <div class="row" style="justify-content:space-between;align-items:center">
        <div class="tiny" style="color:var(--muted)" id="safe-del-help">
          Esperá <span id="safe-del-countdown" style="color:var(--rust);font-family:'JetBrains Mono',monospace;font-weight:600">5s</span> antes de poder confirmar.
        </div>
        <div class="row" style="gap:8px">
          <button class="btn ghost" onclick="closeSafeDelete()">Cancelar</button>
          <button class="btn danger-hard" id="safe-del-confirm" disabled
                  style="opacity:0.4;cursor:not-allowed"
                  onclick="executeSafeDelete()">Eliminar permanentemente</button>
        </div>
      </div>
    </div>
  `);
  setTimeout(()=>{ const el = document.getElementById('safe-del-captcha'); if(el) el.focus(); }, 50);
}

function updateSafeDeleteCountdown(){
  const s = window._safeDeleteState;
  if(!s) return;
  const el = document.getElementById('safe-del-countdown');
  const helpEl = document.getElementById('safe-del-help');
  if(!el) return;
  if(s.countdown > 0){
    el.textContent = s.countdown + 's';
  } else if(helpEl){
    helpEl.innerHTML = s.captchaOK
      ? '<span style="color:var(--sage)">✓ Listo para confirmar</span>'
      : 'Escribí <b style="font-family:JetBrains Mono,monospace;color:var(--rust)">ELIMINAR</b> para habilitar el botón.';
  }
  refreshSafeDeleteButton();
}

function checkSafeDeleteCaptcha(val){
  const s = window._safeDeleteState;
  if(!s) return;
  s.captchaOK = (val||'').trim().toUpperCase() === 'ELIMINAR';
  const helpEl = document.getElementById('safe-del-help');
  if(helpEl && s.countdown === 0){
    helpEl.innerHTML = s.captchaOK
      ? '<span style="color:var(--sage)">✓ Listo para confirmar</span>'
      : 'Escribí <b style="font-family:JetBrains Mono,monospace;color:var(--rust)">ELIMINAR</b> para habilitar el botón.';
  }
  refreshSafeDeleteButton();
}

function refreshSafeDeleteButton(){
  const s = window._safeDeleteState;
  const btn = document.getElementById('safe-del-confirm');
  if(!s || !btn) return;
  const canFire = s.countdown === 0 && s.captchaOK;
  btn.disabled = !canFire;
  btn.style.opacity = canFire ? '1' : '0.4';
  btn.style.cursor = canFire ? 'pointer' : 'not-allowed';
}

function closeSafeDelete(){
  if(window._safeDeleteTimer){ clearInterval(window._safeDeleteTimer); window._safeDeleteTimer = null; }
  window._safeDeleteState = null;
  closeModal();
}

function executeSafeDelete(){
  const s = window._safeDeleteState;
  if(!s) return;
  if(s.countdown > 0 || !s.captchaOK) return;
  const cb = s.onConfirm;
  closeSafeDelete();
  if(typeof cb === 'function') cb();
}

/* v2.3+ — Hard delete with safe-delete modal (type + CAPTCHA + countdown) */
function deleteBatchHard(id){
  const b = db.batches.find(x=>x.id===id);
  if(!b) return;
  const pieceCount = b.pieces?.length || 0;
  const logCount = b.pieces?.reduce((s,p)=>s+(p.weightLogs||[]).length,0) || 0;
  const envCount = (b.envLog||[]).length;
  const details = [
    `${pieceCount} pieza${pieceCount===1?'':'s'}`,
    `${logCount} registro${logCount===1?'':'s'} de peso`,
    envCount>0 ? `${envCount} registros T/HR Govee` : null,
    b.tasting ? 'ficha de cata' : null,
    b.receiving ? 'PCC HACCP de recepción' : null,
    'historial de etapas'
  ].filter(Boolean).join(' · ');
  openSafeDeleteModal({
    kind: 'lote',
    label: b.ref + ' — ' + b.typeName,
    details: details + '.',
    warning: 'Esta acción es irreversible. Si tenés un backup reciente (💾 Backups) podrás restaurarlo.',
    onConfirm: ()=>{
      db.batches = db.batches.filter(x=>x.id!==id);

function saveIngredientEdit(){
  const id = window._editIng;
  const ing = db.ingredients.find(i=>i.id===id);
  if(!ing) return;
  const newName = document.getElementById('ing-en').value.trim();
  const oldName = ing.name;
  if(!newName){ toast('Nombre requerido'); return; }
  ing.name = newName;
  ing.unit = document.getElementById('ing-eu').value;
  ing.category = document.getElementById('ing-ec').value;
  ing.note = document.getElementById('ing-en2').value;
  const densRaw = document.getElementById('ing-edens')?.value;
  ing.gPerTsp = (ing.category==='sal'||ing.category==='sal-curado') && densRaw!=='' && densRaw!=null ? +densRaw : null;
  // If name changed, cascade update through all recipes, inoculants and brine salts
  if(newName !== oldName){
    let count = 0;
    db.types.forEach(t=>{
      t.stages.forEach(s=>{
        if(s.recipe) s.recipe.forEach(r=>{ if(r.ingredient===oldName){ r.ingredient=newName; count++; } });
        if(s.inoc && s.inoc.i===oldName){ s.inoc.i=newName; count++; }
        if(s.brine && s.brine.saltIngredient===oldName){ s.brine.saltIngredient=newName; count++; }
      });
    });
    db.batches.forEach(b=>{
      b.stages.forEach(s=>{
        if(s.recipe) s.recipe.forEach(r=>{ if(r.ingredient===oldName){ r.ingredient=newName; } });
        if(s.inoc && s.inoc.i===oldName){ s.inoc.i=newName; }
        if(s.brine && s.brine.saltIngredient===oldName){ s.brine.saltIngredient=newName; }
      });
    });
    if(count) toast('Actualizado en '+count+' referencia'+(count===1?'':'s'));
  } else {
    toast('Ingrediente actualizado');
  }
  saveDB(); closeModal(); render();
}

/* ═══════════════════════════════════════════════════════════
    iCloud SYNC via File System Access API
    Handle stored in IndexedDB (localStorage can't hold file handles).
    Points at any file the user picks (recommend iCloud Drive folder).
   ═══════════════════════════════════════════════════════════ */

const IDB_NAME = 'laforet_sync';
const IDB_STORE = 'handles';
let _cloudHandle = null;
let _cloudSaveTimer = null;
let _cloudStatus = 'off';   // off | linked | error | denied

function idbGet(key){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>{
      const tx = req.result.transaction(IDB_STORE, 'readonly');
      const store = tx.objectStore(IDB_STORE);
      const g = store.get(key);
      g.onsuccess = ()=> resolve(g.result);
      g.onerror = ()=> reject(g.error);
    };
    req.onerror = ()=> reject(req.error);
  });
}
function idbSet(key, val){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>{
      const tx = req.result.transaction(IDB_STORE, 'readwrite');
      const store = tx.objectStore(IDB_STORE);
      const p = store.put(val, key);
      p.onsuccess = ()=> resolve();
      p.onerror = ()=> reject(p.error);
    };
    req.onerror = ()=> reject(req.error);
  });
}
function idbDel(key){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>{
      const tx = req.result.transaction(IDB_STORE, 'readwrite');
      const store = tx.objectStore(IDB_STORE);
      const d = store.delete(key);
      d.onsuccess = ()=> resolve();
      d.onerror = ()=> reject(d.error);
    };
    req.onerror = ()=> reject(req.error);
  });
}

function icloudSupported(){
  return typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
}

async function icloudLink(){
  if(!icloudSupported()){
    alert('Tu navegador no soporta la API de acceso al sistema de archivos. Usá Chrome, Edge o Brave en Mac desktop.');
    return;
  }
  try {
    // Suggested name — user should navigate to their iCloud Drive folder (~/Library/Mobile Documents/com~apple~CloudDocs/)
    const handle = await window.showSaveFilePicker({
      suggestedName: 'laforet_cellar.json',
      types: [{ description: 'La Forêt data', accept: {'application/json': ['.json']} }],
    });
    _cloudHandle = handle;
    await idbSet('cloudHandle', handle);
    _cloudStatus = 'linked';
    await icloudPush();
    toast('Vinculado · el archivo se guardó en iCloud Drive');
    renderIcloudStatus();
    renderSyncModalBody();
  } catch(err){
    if(err.name !== 'AbortError') console.error(err);
  }
}

async function icloudUnlink(){
  if(!confirm('¿Desvincular el archivo iCloud? Los datos locales quedan intactos.')) return;
  _cloudHandle = null;
  _cloudStatus = 'off';
  await idbDel('cloudHandle');
  toast('Desvinculado');
  renderIcloudStatus();
  renderSyncModalBody();
}

async function icloudEnsurePermission(mode){
  if(!_cloudHandle) return false;
  const opts = { mode };
  if((await _cloudHandle.queryPermission(opts)) === 'granted') return true;
  if((await _cloudHandle.requestPermission(opts)) === 'granted') return true;
  _cloudStatus = 'denied';
  renderIcloudStatus();
  return false;
}

async function icloudPush(manual){
  if(!_cloudHandle){ if(manual) toast('No hay archivo vinculado'); return; }
  try {
    if(!(await icloudEnsurePermission('readwrite'))){ if(manual) toast('Permiso denegado'); return; }
    const w = await _cloudHandle.createWritable();
    await w.write(JSON.stringify(db, null, 2));
    await w.close();
    _cloudStatus = 'linked';
    renderIcloudStatus();
    if(manual) toast('Guardado en iCloud');
  } catch(err){
    console.error('iCloud push error', err);
    _cloudStatus = 'error';
    renderIcloudStatus();
    if(manual) toast('Error al guardar');
  }
}

async function icloudPull(){
  if(!_cloudHandle){ toast('Primero vincula el archivo'); return; }
  if(!(await icloudEnsurePermission('read'))) { toast('Permiso denegado'); return; }
  if(!confirm('Cargar datos desde el archivo iCloud vinculado. ¿Reemplazar los datos locales actuales?')) return;
  try {
    const file = await _cloudHandle.getFile();
    const text = await file.text();
    if(!text.trim()){ toast('El archivo está vacío'); return; }
    db = JSON.parse(text);
    if(typeof migrateSalts==='function') migrateSalts();
      if(typeof migrateWeightLogsToPieces==='function') migrateWeightLogsToPieces();
    saveDBLocal();
    window.db = db;
    render();
    toast('Datos cargados desde iCloud');
    renderSyncModalBody();
  } catch(err){
    console.error('iCloud pull error', err);
    toast('Error al leer el archivo');
  }
}

function icloudDebouncedPush(){
  if(!_cloudHandle) return;
  clearTimeout(_cloudSaveTimer);
  _cloudSaveTimer = setTimeout(()=>{ icloudPush(); }, 800);
}

async function icloudRestoreHandle(){
  try {
    const h = await idbGet('cloudHandle');
    if(h){
      _cloudHandle = h;
      // don't request permission on boot — wait for first write
      _cloudStatus = 'linked';
      renderIcloudStatus();
    }
  } catch(err){ /* first run */ }
}

function renderIcloudStatus(){
  const el = document.getElementById('icloud-status');
  const txt = document.getElementById('icloud-status-text');
  if(!el || !txt) return;
  if(!icloudSupported()){
    el.className = 'icloud-status';
    txt.textContent = 'Sync no disponible';
    return;
  }
  if(!_cloudHandle){
    el.className = 'icloud-status';
    txt.textContent = 'Sync iCloud: configurar';
    return;
  }
  const cls = (_cloudStatus==='error'||_cloudStatus==='denied') ? 'err' : 'on';
  const label = _cloudStatus==='error' ? 'Sync: error' : _cloudStatus==='denied' ? 'Sync: permiso' : 'Sincronizado';
  el.className = 'icloud-status '+cls;
  txt.textContent = label + ' · ' + (_cloudHandle.name||'archivo');
  // refresh modal if open
  if(document.getElementById('sync-modal-body')) renderSyncModalBody();
}

/* Open an EXISTING file (was missing before) — lets you pick a .json already
   in iCloud Drive on another Mac and continue from it. */
async function icloudOpenExisting(){
  if(!icloudSupported()){ alert('Tu navegador no soporta acceso a archivos. Usá Chrome, Edge o Brave en Mac.'); return; }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'La Forêt data', accept: {'application/json': ['.json']} }],
      multiple: false,
    });
    if(!handle) return;
    if(!(await ensureHandlePermission(handle, 'readwrite'))){ toast('Permiso denegado'); return; }
    const file = await handle.getFile();
    const text = await file.text();
    if(text.trim()){
      if(!confirm('Cargar los datos de este archivo y vincularlo para sincronizar. ¿Reemplazar los datos locales actuales?')) return;
      db = JSON.parse(text);
      if(typeof migrateSalts==='function') migrateSalts();
      if(typeof migrateWeightLogsToPieces==='function') migrateWeightLogsToPieces();
      saveDBLocal();
      window.db = db;
    }
    _cloudHandle = handle;
    _cloudStatus = 'linked';
    await idbSet('cloudHandle', handle);
    render();
    toast('Archivo abierto y vinculado');
    renderIcloudStatus();
    renderSyncModalBody();
  } catch(err){
    if(err.name !== 'AbortError'){ console.error(err); toast('No se pudo abrir el archivo'); }
  }
}

async function ensureHandlePermission(handle, mode){
  const opts = { mode };
  if((await handle.queryPermission(opts)) === 'granted') return true;
  if((await handle.requestPermission(opts)) === 'granted') return true;
  return false;
}

function openSyncModal(){
  showModal(`
    <div class="modal">
      <h2>Sincronización con iCloud</h2>
      <div class="sub">Guardá tus datos en un archivo dentro de iCloud Drive para tenerlos en todos tus dispositivos Apple.</div>
      <div id="sync-modal-body"></div>
    </div>
  `);
  renderSyncModalBody();
}

function renderSyncModalBody(){
  const body = document.getElementById('sync-modal-body');
  if(!body) return;
  const supported = icloudSupported();

  if(!supported){
    body.innerHTML = `
      <div class="sync-note warn">
        <b>Este navegador no soporta guardar archivos directamente.</b>
        Safari no permite esta función. Usá <b>Chrome, Edge o Brave</b> en tu Mac para sincronizar por archivo.
        Mientras tanto podés usar <b>Exportar</b> / <b>Importar</b> manualmente.
      </div>
      <div class="sync-actions">
        <button class="btn" onclick="exportDB()">⤓ Exportar JSON</button>
        <button class="btn" onclick="importDB()">⤒ Importar JSON</button>
      </div>
      <div class="foot"><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>
    `;
    return;
  }

  if(!_cloudHandle){
    body.innerHTML = `
      <div class="sync-steps">
        <div class="sync-step"><span class="num">1</span><div><b>Elegí una opción</b><div class="tiny">Creá un archivo nuevo o abrí uno que ya tengas en iCloud Drive.</div></div></div>
        <div class="sync-step"><span class="num">2</span><div><b>Guardalo dentro de iCloud Drive</b><div class="tiny">En el diálogo, navegá a <span class="mono">iCloud Drive</span> (o tu carpeta preferida). macOS lo sincroniza solo.</div></div></div>
        <div class="sync-step"><span class="num">3</span><div><b>Listo</b><div class="tiny">Desde ahí cada cambio se guarda automáticamente en ese archivo.</div></div></div>
      </div>
      <div class="sync-actions">
        <button class="btn primary" onclick="icloudLink()">✛ Crear archivo nuevo</button>
        <button class="btn" onclick="icloudOpenExisting()">⤒ Abrir archivo existente</button>
      </div>
      <div class="sync-note">
        Consejo: guardá el archivo en <span class="mono">iCloud Drive › La Forêt</span> para encontrarlo fácil en tus otros equipos.
      </div>
      <div class="foot"><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>
    `;
    return;
  }

  // linked
  const statusClass = (_cloudStatus==='error') ? 'err' : (_cloudStatus==='denied') ? 'warn' : 'ok';
  const statusMsg = _cloudStatus==='error' ? 'Hubo un error al escribir el archivo. Probá "Guardar ahora".'
    : _cloudStatus==='denied' ? 'El navegador necesita permiso para escribir. Probá "Guardar ahora" y aceptá.'
    : 'Sincronizado. Cada cambio se guarda automáticamente en este archivo.';
  body.innerHTML = `
    <div class="sync-linked">
      <div class="sync-file">
        <span class="ic">☁</span>
        <div>
          <div class="fn mono">${_cloudHandle.name || 'archivo.json'}</div>
          <div class="sync-badge ${statusClass}">${statusMsg}</div>
        </div>
      </div>
    </div>
    <div class="sync-actions">
      <button class="btn primary" onclick="icloudPush(true)">⤓ Guardar ahora</button>
      <button class="btn" onclick="icloudPull()">⤒ Cargar desde archivo</button>
    </div>
    <div class="sync-actions" style="margin-top:8px">
      <button class="btn" onclick="icloudOpenExisting()">Cambiar de archivo</button>
      <button class="btn danger" onclick="icloudUnlink()">Desvincular</button>
    </div>
    <div class="sync-note">
      "Guardar ahora" fuerza la escritura. "Cargar desde archivo" trae la última versión (útil si editaste en otro equipo).
    </div>
    <div class="foot"><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>
  `;
}


/* DnD for flow */
let dragIdx = null;
function dragStart(e, idx){ dragIdx = idx; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function dragEnd(e){ e.target.classList.remove('dragging'); document.querySelectorAll('.flow-stage').forEach(x=>x.classList.remove('dragover')); }
function dragOver(e){ e.preventDefault(); e.currentTarget.classList.add('dragover'); }
function dropStage(e, idx){
  e.preventDefault();
  if(dragIdx===null || dragIdx===idx) return;
  const t = editingType;
  const [s] = t.stages.splice(dragIdx,1);
  t.stages.splice(idx,0,s);
  dragIdx = null; saveDB(); render();
}

/* util */
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function emptyState(title, msg){
  return `<div class="empty"><h3>${title}</h3><div>${msg}</div></div>`;
}

function wireGlobal(){
  // Auto-preserve focus on all number/text/textarea inputs during oninput
  document.querySelectorAll('input[type=number], input[type=text], input:not([type]), textarea').forEach(el=>{
    if(el.dataset.focusWired) return;
    el.dataset.focusWired = '1';
    el.addEventListener('focus', ()=> withFocusPreservation(el));
  });
  // Range sliders: use pointer-based drag detection so the drag isn't broken by re-renders
  document.querySelectorAll('input[type=range]').forEach(el=> wireRangeInput(el));
}

/* ─────────────────────── Boot ─────────────────────── */
if(!loadDB()){ seedDB(); }
// Make db available for inline handlers on option lists (avoid closure issues)
window.db = db;
render();

// Restore iCloud handle if previously linked
icloudRestoreHandle();

// Refresh db reference after any save so inline handlers stay in sync
const _saveOrig = saveDB;
saveDB = function(){ _saveOrig(); window.db = db; };
</script>
