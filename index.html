/* ═══════════════════════════════════════════════════════════
    v2.0 — CIENCIA: aw (Resnik-Chirife), seguridad, outliers
   ═══════════════════════════════════════════════════════════ */

/* aw targets per category (safety floor; good practice is 0.02 below).
   Prosciutto/muscular entero: <= 0.90.  Embutidos fermentados: <= 0.92.
   Soft-cured (bresaola, lomo): <= 0.90.  Default: 0.90. */
const AW_TARGET_BY_CATEGORY = {
  'muscular':   0.90,
  'embutido':   0.92,
  'ahumado':    0.90,
  'default':    0.90
};
function awTargetForType(type){
  if(!type) return AW_TARGET_BY_CATEGORY.default;
  if(typeof type.awTarget === 'number' && type.awTarget > 0) return type.awTarget;
  const key = (type.category||'').toLowerCase();
  for(const k of Object.keys(AW_TARGET_BY_CATEGORY)){
    if(key.includes(k)) return AW_TARGET_BY_CATEGORY[k];
  }
  return AW_TARGET_BY_CATEGORY.default;
}

/* Resnik-Chirife simplified for cured meat.
   Inputs:
     greenG    — initial (green) weight of the piece in grams
     currentG  — current weight in grams (post-dry)
     saltPct   — total NaCl % added relative to green (e.g. 2.8 means 2.8% NaCl of greenG)
     sucrosePct — total sucrose % added (optional)
     waterFracGreen — fraction of green weight that is water (default 0.74 for lean pork/beef)
   Output:
     aw estimate (0..1)
   Model:
     NaClG = saltPct/100 * greenG
     waterG = waterFracGreen * greenG - (greenG - currentG)   [all weight loss is water]
     mNaCl = NaClG / waterG     — NaCl mass fraction in free water (0..1)
     aw ≈ 1 - 0.0085 * (100*mNaCl)  — empirical fit for cured meat (Chirife-Favetto
          regime, calibrated so 40-50% weight loss @ 2.8% salt → aw 0.88-0.93)
          - 0.00013 * sucrosePct
          clipped to [0.4, 0.995]
*/
function calcAw({greenG, currentG, saltPct, sucrosePct=0, waterFracGreen=0.74}){
  if(!greenG || greenG <= 0 || !currentG || currentG <= 0) return null;
  if(currentG > greenG * 1.05) return null; // sanity: gained >5% is weird
  const naClG = (saltPct||0)/100 * greenG;
  const waterInit = waterFracGreen * greenG;
  const waterLost = Math.max(0, greenG - currentG);
  const waterNow = Math.max(0.01 * currentG, waterInit - waterLost);
  const mNaClPct = 100 * naClG / waterNow;
  let aw = 1 - 0.0085 * mNaClPct - 0.00013 * (sucrosePct||0);
  aw = Math.max(0.4, Math.min(0.995, aw));
  return aw;
}

/* Inverse: given target aw and composition, what current weight (g) gets us there?
   Rearrangement of calcAw solving for currentG.
   Returns null if math is impossible (e.g. target aw unreachable at this salt level). */
function targetWeightForAw({greenG, awTarget, saltPct, sucrosePct=0, waterFracGreen=0.74}){
  if(!greenG || !awTarget || !saltPct) return null;
  const naClG = (saltPct/100) * greenG;
  const sugarTerm = 0.00013 * (sucrosePct||0);
  const target_mNaClPct = (1 - awTarget - sugarTerm) / 0.0085;
  if(target_mNaClPct <= 0) return null; // target already met at saturation
  const waterNow = 100 * naClG / target_mNaClPct;
  const waterInit = waterFracGreen * greenG;
  const waterLost = waterInit - waterNow;
  const currentG = greenG - waterLost;
  if(currentG <= 0 || currentG > greenG) return null;
  return currentG;
}

/* Safety status for a piece: combines aw target + stage completion + HACCP PCCs (#25 bloqueo expandido).
   Returns { ready:boolean, aw:number|null, awTarget:number, label, level, haccpBlock } */
function safetyStatus(b, piece){
  const type = db.types.find(t=>t.id===b.typeId);
  const awTarget = awTargetForType(type);
  // Determine applied saltPct for this piece from batch stages
  let saltPct = 2.8;
  (b.stages||[]).forEach(s=>{
    if(s.brine && typeof s.brine.saltPct === 'number' && s.brine.saltPct > 0){
      saltPct = s.brine.saltPct;
    }
  });
  const currentG = latestPieceWeight(piece);
  const aw = calcAw({ greenG: piece.initialWeight, currentG, saltPct });
  const allStagesDone = (b.stages||[]).every(s=>s.done);
  // v2.2 #25 — HACCP block: ANY critical PCC violated → cannot be LISTA
  let haccpBlock = null;
  if(typeof evaluateHaccp === 'function'){
    const hac = evaluateHaccp(b);
    if(hac.summary.criticalFails > 0){
      haccpBlock = `${hac.summary.criticalFails} PCC crítico violado`;
    } else if(hac.summary.fail > 0){
      haccpBlock = `${hac.summary.fail} PCC violado`;
    }
  }
  if(aw === null){
    return { ready:false, aw:null, awTarget, saltPct, haccpBlock, label:'Sin registro de peso', level:'gray' };
  }
  if(haccpBlock){
    return { ready:false, aw, awTarget, saltPct, haccpBlock, label:`BLOQUEADA · ${haccpBlock}`, level:'red' };
  }
  if(aw <= awTarget && allStagesDone){
    return { ready:true, aw, awTarget, saltPct, haccpBlock:null, label:`LISTA · aw ${aw.toFixed(3)}`, level:'green' };
  }
  if(aw <= awTarget && !allStagesDone){
    return { ready:false, aw, awTarget, saltPct, haccpBlock:null, label:`aw OK, etapas pendientes`, level:'yellow' };
  }
  if(aw <= awTarget + 0.01){
    return { ready:false, aw, awTarget, saltPct, haccpBlock:null, label:`Cerca · aw ${aw.toFixed(3)} / ${awTarget.toFixed(2)}`, level:'yellow' };
  }
  return { ready:false, aw, awTarget, saltPct, haccpBlock:null, label:`NO CONSUMIR AÚN · aw ${aw.toFixed(3)}`, level:'red' };
}

/* Outlier detection on new weight log entry.
   suspicious if: loss > 5% within 24h of previous log, OR gain > 1% (any time). */
function isWeightSuspicious(piece, newWeightG, newDateISO){
  const logs = (piece.weightLogs||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const prev = logs.length > 0 ? logs[logs.length-1] : null;
  const baselineW = prev ? prev.weight : piece.initialWeight;
  const baselineDate = prev ? new Date(prev.date) : null;
  const newDate = new Date(newDateISO);
  if(baselineW <= 0) return null;
  const delta = newWeightG - baselineW;
  const deltaPct = 100 * delta / baselineW;
  // Gain of any amount > 1% is suspect
  if(deltaPct > 1){
    return { kind:'gain', pct:deltaPct, msg:`Ganancia inusual de ${deltaPct.toFixed(1)}% desde registro previo` };
  }
  // Loss > 5% within 24h is suspect
  if(baselineDate){
    const hours = (newDate - baselineDate) / (1000*60*60);
    if(hours > 0 && hours < 24 && deltaPct < -5){
      return { kind:'fast-loss', pct:deltaPct, hours, msg:`Pérdida de ${Math.abs(deltaPct).toFixed(1)}% en ${hours.toFixed(1)}h — ¿error de báscula?` };
    }
  }
  return null;
}

/* ═══════════════════════════════════════════════════════════
    v2.1 — FÍSICA DEL SECADO: VPD, k drying, case hardening
   ═══════════════════════════════════════════════════════════ */

/* Saturation vapor pressure of water (kPa) at T °C using Tetens.
   Valid for charcuterie range (0-40°C). */
function saturationVaporPressure(tempC){
  return 0.6108 * Math.exp(17.27 * tempC / (tempC + 237.3));
}

/* Vapor Pressure Deficit (kPa): the driver of surface evaporation.
   VPD = (1 - HR/100) * SVP(T). Higher VPD = faster surface drying. */
function vaporPressureDeficit(tempC, hrPct){
  if(tempC===null || hrPct===null) return null;
  return (1 - hrPct/100) * saturationVaporPressure(tempC);
}

/* Theoretical drying rate constant k (1/day) for exponential decay model.
   Model: W(t) = W_target + (W0 - W_target) * exp(-k*t)
   k is driven by Fick-like diffusion with VPD gradient:
     k ≈ k_ref * (VPD / VPD_ref) * (L_ref/L)^2 * geom
   where L is half-thickness in cm, geom accounts for cylinder vs flat.
   Reference calibration: at 13°C, 75% HR, 3cm half-thickness cylinder → k ≈ 0.012/d
   (characteristic time ~85d to reach 60% of total loss, matches bresaola 60-90d).
*/
function dryingRateK({tempC=13, hrPct=75, thicknessCm=6, shape='tubular'}){
  const vpd = vaporPressureDeficit(tempC, hrPct);
  const vpdRef = vaporPressureDeficit(13, 75); // ~0.374 kPa
  if(!vpd || vpd<=0) return 0;
  const L = Math.max(0.5, (thicknessCm||6)/2); // half-thickness cm
  const Lref = 3; // half-thickness reference
  const geom = shape==='flat' ? 0.65 : 1.0; // flat dries faster per volume
  const kRef = 0.012; // 1/d calibrated reference
  return kRef * (vpd/vpdRef) * Math.pow(Lref/L, 2) * geom;
}

/* Theoretical weight(t) for a piece given envelope-averaged T, HR. */
function theoreticalWeightAt({W0, Wtarget, k, t}){
  if(!k || k<=0) return W0;
  return Wtarget + (W0 - Wtarget) * Math.exp(-k * t);
}

/* Env stats for a batch (optionally filtered to a stage kind).
   Returns {avgT, avgHR, nSamples, kind} or null if no data. */
function envStats(b, stageKind=null){
  if(!b.envLog || b.envLog.length === 0) return null;
  let logs = b.envLog;
  if(stageKind) logs = logs.filter(l => l.stageKind===stageKind || !l.stageKind);
  const ts = logs.map(l=>l.tempC).filter(v=>v!==null && !isNaN(v));
  const hs = logs.map(l=>l.hr).filter(v=>v!==null && !isNaN(v));
  if(ts.length===0 && hs.length===0) return null;
  const avg = arr => arr.length ? arr.reduce((s,v)=>s+v,0)/arr.length : null;
  return {
    avgT: avg(ts),
    avgHR: avg(hs),
    nSamples: logs.length,
    kind: stageKind
  };
}

/* Case hardening risk evaluation for a piece.
   Case hardening = surface evaporation >> internal water migration.
   Ratio: VPD / (expected safe VPD at this grosor) > 1.2 → risk.
   Returns { risk:boolean, ratio:number, vpd:number, msg:string } or null if no envlog. */
function caseHardeningRisk(b, piece){
  const stats = envStats(b, 'Secado') || envStats(b, 'Madurado') || envStats(b);
  if(!stats || stats.avgT===null || stats.avgHR===null) return null;
  const vpd = vaporPressureDeficit(stats.avgT, stats.avgHR);
  // Safe VPD threshold scales with piece grosor: thicker piece → lower safe VPD
  // Reference: 6cm thickness, safe VPD ≈ 0.45 kPa (ambient 13°C/70%HR = 0.448)
  const safeVpd = 0.45 * (6 / Math.max(2, piece.thickness||6));
  const ratio = vpd / safeVpd;
  const risk = ratio > 1.2;
  let msg = '';
  if(risk){
    const hrSuggest = Math.min(90, Math.round(stats.avgHR + 10));
    msg = `Riesgo case hardening (ratio ${ratio.toFixed(2)}) — considera subir HR a ${hrSuggest}%`;
  }
  return { risk, ratio, vpd, safeVpd, avgT: stats.avgT, avgHR: stats.avgHR, msg };
}

/* ═══════════════════════════════════════════════════════════
    v2.1 — BALANCE DE MASA
   ═══════════════════════════════════════════════════════════ */

/* Compute mass balance for a batch.
   Equation: green + salt_added = current + water_evaporated + unexplained_loss
   Returns { greenG, saltG, currentG, waterLostG, unexplainedG, unexplainedPct, balanced } */
function massBalance(b){
  const greenG = b.pieces.reduce((s,p)=>s + (p.initialWeight||0), 0);
  const currentG = b.pieces.reduce((s,p)=>s + latestPieceWeight(p), 0);
  // Salt added: sum of saltPct from all stages × greenG (approx)
  let saltG = 0;
  (b.stages||[]).forEach(s=>{
    if(s.brine && s.brine.saltPct){
      saltG += (s.brine.saltPct/100) * greenG;
    }
  });
  // Add cure salt if present
  (b.stages||[]).forEach(s=>{
    if(s.brine && s.brine.cureSalt && s.brine.cureSalt.gPerKg){
      saltG += s.brine.cureSalt.gPerKg * (greenG/1000);
    }
  });
  // Theoretical: water evaporated = greenG + saltG - currentG, under ideal (no misc loss)
  // In practice there's drip loss, mold removed, etc. Compare measured vs expected water loss
  // using an assumption: 100% of weight change beyond salt is water
  const theoreticalInput = greenG + saltG;
  const totalDelta = theoreticalInput - currentG; // positive = net loss
  // Water loss cap: can't exceed green water content (~74% of green)
  const maxPossibleWater = 0.74 * greenG;
  const waterLostG = Math.min(totalDelta, maxPossibleWater);
  const unexplainedG = totalDelta - waterLostG;
  const unexplainedPct = greenG > 0 ? 100 * unexplainedG / greenG : 0;
  const balanced = Math.abs(unexplainedPct) <= 2;
  return { greenG, saltG, currentG, waterLostG, unexplainedG, unexplainedPct, totalDelta, balanced };
}

/* ═══════════════════════════════════════════════════════════
    v2.2 — HACCP OPERATIVO
    #16 PCCs por tipo · #17 Fermentado cross · #19 Hazards · #23 Desviaciones · #25 Bloqueo
   ═══════════════════════════════════════════════════════════ */

/* Hazard catalog by category.
   Each type belongs to a category — the hazards declared by that category apply. */
const HAZARD_CATALOG = {
  'muscular': {
    biologicos: ['Listeria monocytogenes','Salmonella spp.','S. aureus','Toxoplasma gondii','Trichinella (cerdo)','E. coli STEC'],
    quimicos: ['Nitrito residual (ADI 0.07 mg/kg)','Micotoxinas (moho malo)','Metales pesados (carne contaminada)'],
    fisicos: ['Fragmentos óseos','Fragmentos metálicos','Pelo o fibras']
  },
  'embutido': {
    biologicos: ['Clostridium botulinum (crítico)','Listeria monocytogenes','Salmonella spp.','S. aureus','E. coli STEC','Mohos toxigénicos'],
    quimicos: ['Nitrito residual','Aminas biogénicas (histamina)','Micotoxinas','Alérgenos no declarados'],
    fisicos: ['Fragmentos óseos','Fragmentos metálicos','Trozos de tripa dura']
  },
  'ahumado': {
    biologicos: ['Listeria monocytogenes','Salmonella spp.','S. aureus (si no supera 70°C centro)'],
    quimicos: ['HAPs del humo (benzo[a]pireno)','Nitrosaminas','Nitrito residual','Formaldehído'],
    fisicos: ['Astillas de madera','Ceniza']
  }
};

function hazardsForType(type){
  if(!type) return null;
  const cat = (type.category||'').toLowerCase();
  for(const key of Object.keys(HAZARD_CATALOG)){
    if(cat.includes(key)) return { category: key, hazards: HAZARD_CATALOG[key] };
  }
  return { category: 'default', hazards: HAZARD_CATALOG['muscular'] };
}

/* Default PCCs by category — applied if the type doesn't declare its own. */
function defaultPCCsForType(type){
  if(!type) return [];
  const cat = (type.category||'').toLowerCase();
  const hasFerm = (type.stages||[]).some(s=>s.kind==='Fermentado');
  const hasAhumado = (type.stages||[]).some(s=>s.kind==='Ahumado');
  const pccs = [];
  // PCC 1: receiving core T
  pccs.push({
    id: 'pcc-recep', label: 'Recepción core T ≤ 4°C',
    stage: 'Recepción', metric: 'coreT', op: '<=', value: 4,
    severity: 'critical', hazard: 'Crecimiento mesófilos pre-cura'
  });
  // PCC 2: aw target
  const awLim = cat.includes('embutido') ? 0.92 : 0.90;
  pccs.push({
    id: 'pcc-aw', label: `aw final ≤ ${awLim}`,
    stage: 'Final', metric: 'aw', op: '<=', value: awLim,
    severity: 'critical', hazard: 'Agua libre para patógenos'
  });
  // PCC 3: Fermentación pH drop (only if type has fermentation)
  if(hasFerm){
    pccs.push({
      id: 'pcc-ferm-ph', label: 'Fermentación: pH ≤ 5.3 en 48h',
      stage: 'Fermentado', metric: 'phDropHours', op: '<=', value: 48,
      severity: 'critical', hazard: 'C. botulinum / S. aureus (ventana)'
    });
  }
  // PCC 4: Ahumado core T (if applies, for cold smoke) — informational only
  if(hasAhumado){
    pccs.push({
      id: 'pcc-ahum-t', label: 'Ahumado: T superficie ≤ límite del método',
      stage: 'Ahumado', metric: 'smokeTemp', op: '<=', value: 30,
      severity: 'warning', hazard: 'HAPs del humo (ahumado alto)'
    });
  }
  return pccs;
}

function pccsForType(type){
  if(!type) return [];
  if(Array.isArray(type.haccpPCCs) && type.haccpPCCs.length > 0) return type.haccpPCCs;
  return defaultPCCsForType(type);
}

/* Evaluate HACCP for a batch: iterate PCCs, check status, return results. */
function evaluateHaccp(b){
  const type = db.types.find(t=>t.id===b.typeId);
  const pccs = pccsForType(type);
  const results = pccs.map(pcc=>{
    let status = 'pending', detail = '', measured = null;
    switch(pcc.metric){
      case 'coreT': {
        const t = b.receiving?.coreT;
        if(t === null || t === undefined){ status = 'pending'; detail = 'Sin core T registrada'; }
        else { measured = t; status = (t <= pcc.value) ? 'pass' : 'fail'; detail = `${t}°C ${pcc.op} ${pcc.value}°C`; }
        break;
      }
      case 'aw': {
        // Worst-case aw across all pieces — compute directly to avoid safetyStatus↔evaluateHaccp recursion
        let saltPct = 2.8;
        (b.stages||[]).forEach(s=>{
          if(s.brine && typeof s.brine.saltPct === 'number' && s.brine.saltPct > 0) saltPct = s.brine.saltPct;
        });
        const anyLogged = b.pieces.some(p => (p.weightLogs||[]).length > 0);
        const allStagesDone = (b.stages||[]).every(s=>s.done);
        if(!anyLogged){ status='pending'; detail = 'Sin registros de peso aún'; break; }
        const aws = b.pieces.map(p=>{
          const cur = latestPieceWeight(p);
          return calcAw({ greenG: p.initialWeight, currentG: cur, saltPct });
        }).filter(v=>v!==null);
        if(aws.length === 0){ status = 'pending'; detail = 'Sin aws calculables'; }
        else {
          const worstAw = Math.max(...aws);
          measured = worstAw;
          if(worstAw <= pcc.value){ status='pass'; detail = `aw peor pieza ${worstAw.toFixed(3)} ≤ ${pcc.value.toFixed(2)}`; }
          else if(!allStagesDone){ status='pending'; detail = `aw peor pieza ${worstAw.toFixed(3)} · en proceso, aún faltan etapas`; }
          else if(worstAw <= pcc.value + 0.01){ status='warn'; detail = `aw peor pieza ${worstAw.toFixed(3)} apenas sobre ${pcc.value.toFixed(2)}`; }
          else { status='fail'; detail = `aw peor pieza ${worstAw.toFixed(3)} > ${pcc.value.toFixed(2)} con todas las etapas terminadas`; }
        }
        break;
      }
      case 'phDropHours': {
        // Did pH drop below 5.3 within pcc.value hours of fermentation start?
        const fermStage = (b.stages||[]).find(s=>s.kind==='Fermentado' && s.startedAt);
        if(!fermStage){ status = 'pending'; detail = 'Sin etapa de Fermentado'; break; }
        const start = new Date(fermStage.startedAt).getTime();
        const phLogs = (b.phLogs||[]).filter(l=>l.stageKind==='Fermentado').sort((a,b)=>new Date(a.date)-new Date(b.date));
        const okLog = phLogs.find(l=> l.ph <= 5.3 && (new Date(l.date).getTime() - start)/(1000*60*60) <= pcc.value);
        const hoursSinceStart = (Date.now() - start)/(1000*60*60);
        if(okLog){
          const hrs = (new Date(okLog.date).getTime() - start)/(1000*60*60);
          measured = hrs; status = 'pass'; detail = `pH ${okLog.ph} alcanzado en ${hrs.toFixed(1)}h`;
        } else if(hoursSinceStart >= pcc.value){
          status = 'fail'; detail = `${hoursSinceStart.toFixed(0)}h transcurridas sin pH ≤ 5.3 — riesgo botulismo`;
        } else {
          status = 'pending'; detail = `${hoursSinceStart.toFixed(0)}h / ${pcc.value}h · pH pendiente de caer`;
        }
        break;
      }
      case 'smokeTemp': {
        const smokeStage = (b.stages||[]).find(s=>s.kind==='Ahumado');
        if(!smokeStage || !smokeStage.smoke){ status = 'pending'; detail = 'Sin configuración de Ahumado'; break; }
        const smokeT = smokeStage.smoke.tempC || null;
        if(smokeT === null){ status = 'pending'; detail = 'Sin T de ahumado definida'; }
        else { measured = smokeT; status = (smokeT <= pcc.value) ? 'pass' : 'warn'; detail = `${smokeT}°C ${pcc.op} ${pcc.value}°C`; }
        break;
      }
      default: status = 'pending'; detail = 'Métrica no reconocida';
    }
    return { pcc, status, detail, measured };
  });
  const summary = {
    total: results.length,
    pass: results.filter(r=>r.status==='pass').length,
    warn: results.filter(r=>r.status==='warn').length,
    fail: results.filter(r=>r.status==='fail').length,
    pending: results.filter(r=>r.status==='pending').length,
    criticalFails: results.filter(r=>r.status==='fail' && r.pcc.severity==='critical').length
  };
  return { results, summary };
}

/* Record a deviation and its corrective action */
function recordDeviation(batchId, data){
  const b = db.batches.find(x=>x.id===batchId);
  if(!b) return;
  if(!b.deviations) b.deviations = [];
  b.deviations.push({
    id: uid('dev'),
    ts: new Date().toISOString(),
    pccId: data.pccId || null,
    pccLabel: data.pccLabel || '',
    description: data.description || '',
    action: data.action || '',
    outcome: data.outcome || 'open',
    author: 'operador'
  });
  saveDB();
}

function openDeviationModal(batchId, pccId, pccLabel, suggestedDescription){
  showModal(`
    <div class="modal">
      <div class="modal-head"><h2>Registrar desviación HACCP</h2><button class="btn ghost" onclick="closeModal()">✕</button></div>
      <p class="tiny" style="margin-bottom:12px;color:var(--muted)">PCC: <b style="color:var(--rust)">${escapeHtml(pccLabel||'(sin PCC específico)')}</b></p>

function saveDeviation(batchId, pccId, pccLabel){
  const desc = document.getElementById('dev-desc').value.trim();
  const action = document.getElementById('dev-action').value.trim();
  const outcome = document.getElementById('dev-outcome').value;
  if(!desc){ toast('Describí qué pasó'); return; }
  recordDeviation(batchId, { pccId, pccLabel, description: desc, action, outcome });
  closeModal(); render(); toast('Desviación registrada');
}

/* ═══════════════════════════════════════════════════════════
    v2.4 — OFICIO: Fick sal, Fick humo, perfil, proteólisis, defectos
   ═══════════════════════════════════════════════════════════ */

/* #06 — Fick salt diffusion.
   Effective D in meat depends on T (Arrhenius) and fat content (fat slows diffusion).
   Reference D at 5°C, lean muscle: ~3.0e-10 m²/s.
   Q10 for diffusion ~1.5 (modest T dependence).
   Fat correction: D_eff = D_lean * (1 - 0.6*fatFrac)
*/
function diffusivitySaltMeat({tempC=5, fatPct=20}){
  const Dref = 3.0e-10; // m²/s at 5°C
  const Q10 = 1.5;
  const Dt = Dref * Math.pow(Q10, (tempC - 5) / 10);
  const fatFrac = Math.max(0, Math.min(0.6, (fatPct||20) / 100));
  const Dfat = Dt * (1 - 0.6 * fatFrac);
  return Math.max(1e-11, Dfat);
}

/* Days to reach ~95% equilibrium of NaCl at center.
   t_eq(95%) ≈ 3 × L² / (π² · D)  where L = half-thickness in meters.
   For cylinder: L is radius (thickness/2). For flat sheet: L is half the thickness.
   For a thin plane the characteristic is similar in order of magnitude. */
function fickSaltPenetrationDays({thicknessCm, shape='tubular', tempC=5, fatPct=20}){
  if(!thicknessCm || thicknessCm <= 0) return null;
  const L = (thicknessCm/2) / 100; // meters
  const D = diffusivitySaltMeat({tempC, fatPct});
  // Shape factor: cylinder slightly slower than flat (longer center distance)
  const shapeFactor = (shape === 'flat') ? 1.0 : 1.15;
  const seconds = 3 * shapeFactor * (L*L) / (Math.PI * Math.PI * D);
  return seconds / 86400; // days
}

/* Returns { daysNeeded, daysConfigured, status, ratio, msg } */
function evaluateFickSalt(nb, type){
  const typeStage = (type?.stages||[]).find(s=>s.kind==='Curado');
  const daysConfigured = typeStage?.dEst || null;
  if(!daysConfigured || !nb.pieces?.length) return null;
  const maxThickness = Math.max(...nb.pieces.map(p=>+p.thickness||0), 1);
  const shape = nb.pieces[0]?.shape || 'tubular';
  const tempC = typeStage?.env?.T ?? 5;
  const fatPct = type?.fatPct ?? 20; // default lean estimation
  const daysNeeded = fickSaltPenetrationDays({ thicknessCm: maxThickness, shape, tempC, fatPct });
  if(!daysNeeded) return null;
  const ratio = daysConfigured / daysNeeded;
  let status, msg;
  if(ratio >= 1.3){ status='excess'; msg = `Curado configurado (${daysConfigured}d) excede ampliamente Fick (${daysNeeded.toFixed(0)}d) — considera reducir`; }
  else if(ratio >= 1.0){ status='ok'; msg = `Curado ${daysConfigured}d ≥ Fick ${daysNeeded.toFixed(0)}d · penetración al centro OK`; }
  else if(ratio >= 0.85){ status='warn'; msg = `Curado ${daysConfigured}d está marginal · Fick sugiere ${daysNeeded.toFixed(0)}d para completa penetración`; }
  else { status='fail'; msg = `⚠ Curado ${daysConfigured}d insuficiente · Fick predice ${daysNeeded.toFixed(0)}d para alcanzar el centro`; }
  return { daysNeeded, daysConfigured, status, ratio, msg, maxThickness, tempC };
}

/* #15 — Fick smoke penetration profile.
   D_smoke much smaller than D_salt. Reference D at 20°C ≈ 1e-11 m²/s.
   Hot smoke penetrates faster (higher D).
   Returns array of {depthMm, saturationPct} up to the piece half-thickness. */
/* Effective D for smoke "flavor" penetration — captures Fickian diffusion plus
   adsorption/desorption across proteins and limited convection through pores.
   Empirically calibrated so 6h@25°C gives ~15% saturation at 4mm (matches
   taste-panel data in commercial cold-smoked meats). */
function diffusivitySmoke({tempC=25}){
  const Dref = 2e-10; // effective, at 20°C
  const Q10 = 1.8;
  return Dref * Math.pow(Q10, (tempC-20)/10);
}

/* Compute saturation at depth x after time t for 1D diffusion from both sides,
   assuming piece as plane with surface held at saturated concentration C_sat.
   C(x,t)/C_sat ≈ 1 - erf(x / (2*sqrt(D*t)))  [simplified semi-infinite approximation] */
function erfApprox(x){
  // Abramowitz & Stegun 7.1.26 approximation
  const sign = Math.sign(x);
  x = Math.abs(x);
  const a1= 0.254829592, a2=-0.284496736, a3=1.421413741, a4=-1.453152027, a5=1.061405429, p=0.3275911;
  const t = 1 / (1 + p*x);
  const y = 1 - (((((a5*t + a4)*t) + a3)*t + a2)*t + a1)*t * Math.exp(-x*x);
  return sign * y;
}

function fickSmokeProfile({thicknessCm, tempC=25, hours=6}){
  if(!thicknessCm || !hours) return null;
  const D = diffusivitySmoke({tempC});
  const tSec = hours * 3600;
  const halfMm = (thicknessCm/2) * 10;
  const points = [];
  for(let depthMm = 0; depthMm <= halfMm; depthMm += Math.max(1, halfMm/8)){
    const x = depthMm / 1000; // m
    // semi-infinite 1D (reasonable for depth << half-thickness)
    const sat = (depthMm === 0) ? 100 : (1 - erfApprox(x / (2*Math.sqrt(D*tSec)))) * 100;
    points.push({ depthMm: Math.round(depthMm), saturationPct: Math.max(0, Math.min(100, sat)) });
  }
  if(points[points.length-1].depthMm < halfMm){
    const x = halfMm/1000;
    const sat = (1 - erfApprox(x / (2*Math.sqrt(D*tSec)))) * 100;
    points.push({ depthMm: Math.round(halfMm), saturationPct: Math.max(0, Math.min(100, sat)) });
  }
  return points;
}

/* #09 — Predicted organoleptic profile from recipe parameters.
   Scales 0-10 each axis. Heuristic, calibrated against classic references.
   - salado: scales with %NaCl in final product (postdry)
   - umami: scales with proteolysis time × T
   - dulce: scales with sucrose % + aged (acetaldehyde reduction)
   - acido: scales with pH drop (fermented) or nothing
   - firmeza: scales with aw drop (lower aw = firmer)
*/
function predictProfile(type, batchYield){
  const yieldFinal = batchYield ?? type?.yield?.target ?? 60;
  // Average salt % across Curado stages
  let saltPct = 0;
  (type?.stages||[]).forEach(s=>{
    if(s.brine?.saltPct) saltPct += s.brine.saltPct;
  });
  if(saltPct === 0) saltPct = 2.8;
  // Sugar % (approx): any recipe ingredient flagged as sugar
  let sugarPct = 0;
  (type?.stages||[]).forEach(s=>{
    (s.recipe||[]).forEach(r=>{
      const ing = (db.ingredients||[]).find(i=>i.name===r.ingredient);
      if(ing && (ing.category === 'azucar')){
        sugarPct += (+r.amount || 0) / 1000; // amount in g/kg → %
      }
    });
  });
  // Fermented?
  const hasFerm = (type?.stages||[]).some(s=>s.kind==='Fermentado');
  // Smoked?
  const hasSmoke = (type?.stages||[]).some(s=>s.kind==='Ahumado');
  // Total days (sum of dEst)
  const daysTotal = (type?.stages||[]).reduce((s,st)=>s+(st.dEst||0),0);
  // Average cava T estimate (default 13 if not specified in any stage)
  let avgT = 13;
  // concentration factor: salt in final = salt_added / yield_fraction
  const concFactor = 100 / Math.max(30, yieldFinal);
  const saltFinal = saltPct * concFactor;
  // Scores (0-10)
  const salado = Math.min(10, Math.max(0, saltFinal * 1.6)); // ~2.8%→4.5 ingoing × conc → ~7-8
  const umami = Math.min(10, Math.max(0, 3 + 0.03 * daysTotal + (hasFerm?1.5:0)));
  const dulce = Math.min(10, Math.max(0, sugarPct * 2.5 + (daysTotal>120?1:0)));
  const acido = Math.min(10, Math.max(0, hasFerm ? 5 + 0.01*daysTotal : 1));
  const firmeza = Math.min(10, Math.max(0, (100 - yieldFinal) * 0.18)); // 40% loss → 7.2
  const ahumado = hasSmoke ? Math.min(10, 3 + ((type?.stages||[]).find(s=>s.kind==='Ahumado')?.smoke?.hours || 0) * 0.3) : 0;
  return { salado, umami, dulce, acido, firmeza, ahumado,
    _meta: { saltPct, sugarPct, hasFerm, hasSmoke, daysTotal, yieldFinal, saltFinal } };
}

/* Compare predicted vs tasting (from b.tasting) if available */
function compareProfile(type, batch){
  const pred = predictProfile(type, batch?.targetYield);
  if(!batch?.tasting) return { predicted: pred, tasted: null };
  const t = batch.tasting;
  // Tasting uses 0-5 for dulce/salado/umami/amargo/acido — scale to 0-10
  const tasted = {
    salado: (t.salado ?? 0) * 2,
    umami: (t.umami ?? 0) * 2,
    dulce: (t.dulce ?? 0) * 2,
    acido: (t.acido ?? 0) * 2,
    firmeza: (t.textura ?? 0) * 2
  };
  return { predicted: pred, tasted };
}

/* #10 — Proteolysis index with Q10=2.
   Reference: at 15°C for 365 days (jamón ibérico base) → index 100.
   Formula: Index = ∫ 2^((T-15)/10) · dt    where t is in days
   For constant T over N days: Index = N × 2^((T-15)/10) / 365 × 100
*/
function proteolysisIndex({avgTempC, days}){
  if(!avgTempC || !days || days <= 0) return null;
  const factor = Math.pow(2, (avgTempC - 15) / 10);
  const idx = (days * factor / 365) * 100;
  return {
    index: idx,
    factor,
    label: idx < 20 ? 'muy baja (textura firme, poca complejidad)' :
           idx < 40 ? 'baja (textura firme, aroma simple)' :
           idx < 70 ? 'media (bresaola / lomo típico)' :
           idx < 100 ? 'alta (madurada compleja)' :
           idx < 150 ? 'muy alta (prosciutto largo)' :
           'extrema (jamón ibérico añejo)'
  };
}

/* Compute proteolysis for a batch using Govee avgT if available, else default. */
function batchProteolysis(b){
  const stageDays = (b.stages||[]).reduce((s,st)=>{
    if(st.kind==='Secado' || st.kind==='Madurado' || st.kind==='Balanceo'){
      const start = st.startedAt ? new Date(st.startedAt).getTime() : null;
      const end = st.actualEnd ? new Date(st.actualEnd).getTime() : (st.expectedEnd ? new Date(st.expectedEnd).getTime() : null);
      if(start && end) return s + (end-start)/86400000;
    }
    return s;
  }, 0);
  if(stageDays <= 0) return null;
  const env = (typeof envStats === 'function') ? envStats(b) : null;
  const avgT = env?.avgT ?? 13;
  return proteolysisIndex({ avgTempC: avgT, days: stageDays });
}

/* Pearson correlation coefficient between two arrays of equal length. */
function pearson(xs, ys){
  const n = Math.min(xs.length, ys.length);
  if(n < 3) return null;
  const pairs = [];
  for(let i=0; i<n; i++){
    if(xs[i]!==null && xs[i]!==undefined && !isNaN(xs[i]) &&
       ys[i]!==null && ys[i]!==undefined && !isNaN(ys[i])){
      pairs.push([xs[i], ys[i]]);
    }
  }
  if(pairs.length < 3) return null;
  const mx = pairs.reduce((s,[a])=>s+a,0)/pairs.length;
  const my = pairs.reduce((s,[,a])=>s+a,0)/pairs.length;
  let num=0, dx2=0, dy2=0;
  for(const [x,y] of pairs){ const dx=x-mx, dy=y-my; num+=dx*dy; dx2+=dx*dx; dy2+=dy*dy; }
  if(dx2===0 || dy2===0) return null;
  return { r: num / Math.sqrt(dx2*dy2), n: pairs.length };
}

/* Extract analysis features from a batch: everything numeric we can regress against. */
function batchFeatures(b){
  const type = db.types.find(t=>t.id===b.typeId);
  const totalGreen = b.pieces.reduce((s,p)=>s+p.initialWeight,0);
  const totalCurrent = b.pieces.reduce((s,p)=>s+latestPieceWeight(p),0);
  const yieldReal = totalGreen>0 ? 100 * totalCurrent/totalGreen : null;
  const yieldTarget = b.targetYield || null;
  // Average salt % across Curado stages
  let saltPct = null;
  (b.stages||[]).forEach(s=>{
    if(s.brine && s.brine.saltPct){
      saltPct = (saltPct||0) + s.brine.saltPct;
    }
  });
  // Days total: start → finish
  let daysTotal = null;
  if(b.startedAt){
    const end = b.finishedAt ? new Date(b.finishedAt) : new Date();
    daysTotal = (end - new Date(b.startedAt))/(1000*60*60*24);
  }
  // Average thickness
  const avgThickness = b.pieces.reduce((s,p)=>s+(p.thickness||0),0)/Math.max(1,b.pieces.length);
  // Env from log (any stage)
  const env = envStats(b);
  // Compute aw of the heaviest/representative piece at current weight
  const repPiece = b.pieces[0];
  const safety = repPiece ? safetyStatus(b, repPiece) : null;
  // Receiving core T
  const coreT = b.receiving?.coreT ?? null;
  // Tasting
  const notaGlobal = b.tasting?.notaGlobal ?? null;
  const monthStarted = b.startedAt ? new Date(b.startedAt).getUTCMonth()+1 : null;
  const yearStarted = b.startedAt ? new Date(b.startedAt).getUTCFullYear() : null;
  return {
    batchId: b.id, ref: b.ref, typeId: b.typeId, typeName: b.typeName,
    status: b.status,
    yieldReal, yieldTarget,
    saltPct, daysTotal, avgThickness,
    avgT: env?.avgT ?? null, avgHR: env?.avgHR ?? null,
    aw: safety?.aw ?? null,
    coreT,
    notaGlobal,
    aroma: b.tasting?.aroma ?? null,
    textura: b.tasting?.textura ?? null,
    apariencia: b.tasting?.apariencia ?? null,
    monthStarted, yearStarted,
    startedAt: b.startedAt, finishedAt: b.finishedAt
  };
}

/* Historical yield stats per type (across all finished batches of that type). */
function historicalYieldStats(typeId){
  const batches = db.batches.filter(b => b.typeId===typeId && (b.status==='done' || b.status==='in_progress'));
  const yields = [];
  batches.forEach(b=>{
    const f = batchFeatures(b);
    if(f.yieldReal !== null && b.status==='done'){
      yields.push(f.yieldReal);
    }
  });
  if(yields.length === 0) return { n:0 };
  const mean = yields.reduce((s,v)=>s+v,0)/yields.length;
  const variance = yields.reduce((s,v)=>s+(v-mean)**2,0)/yields.length;
  const std = Math.sqrt(variance);
  const min = Math.min(...yields);
  const max = Math.max(...yields);
  return { n: yields.length, mean, std, min, max, yields };
}

/* Stage-by-stage loss breakdown for a single batch.
   Uses weight-logs tagged in time: for each stage, estimate the weight at the END of that stage. */
function stageLossBreakdown(b){
  if(!b.stages || b.stages.length === 0) return [];
  const totalGreen = b.pieces.reduce((s,p)=>s+p.initialWeight,0);
  // Build timeline: for each stage, estimate the batch weight at the end
  // Use linear interpolation of weight logs across all pieces.
  const result = [];
  let prevWeight = totalGreen;
  b.stages.forEach((s)=>{
    const endDate = s.actualEnd || s.expectedEnd || null;
    if(!endDate) return;
    const endTs = new Date(endDate).getTime();
    // Sum weights across pieces at endTs (nearest log before+after, linear interp)
    let batchWeightAtEnd = 0;
    b.pieces.forEach(p=>{
      const logs = (p.weightLogs||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
      const greenEntry = { date: b.startedAt, weight: p.initialWeight };
      const all = [greenEntry].concat(logs.map(l=>({date:l.date, weight:l.weight, outlier:l.outlier})))
                                .filter(l=>!l.outlier);
      // Find bracket
      let w = null;
      if(endTs <= new Date(all[0].date).getTime()) w = all[0].weight;
      else if(endTs >= new Date(all[all.length-1].date).getTime()) w = all[all.length-1].weight;
      else {
        for(let i=0; i<all.length-1; i++){
          const t1 = new Date(all[i].date).getTime();
          const t2 = new Date(all[i+1].date).getTime();
          if(endTs >= t1 && endTs <= t2){
            const f = (endTs - t1) / (t2 - t1);
            w = all[i].weight + f * (all[i+1].weight - all[i].weight);
            break;
          }
        }
      }
      batchWeightAtEnd += w ?? p.initialWeight;
    });
    const lossInStage = prevWeight - batchWeightAtEnd;
    const lossPct = totalGreen > 0 ? 100 * lossInStage / totalGreen : 0;
    result.push({
      kind: s.kind,
      startedAt: s.startedAt, endedAt: endDate,
      weightAtEnd: batchWeightAtEnd,
      lossInStage, lossPct
    });
    prevWeight = batchWeightAtEnd;
  });
  return result;
}

/* #43 Correlaciones cata vs parámetros */
function renderCorrelationsSection(typesWithData){
  // Only types with 4+ tasted batches
  const correlatable = typesWithData.filter(({batches})=>batches.filter(b=>b.tasting?.notaGlobal != null).length >= 4);
  if(correlatable.length === 0){
    return `<div class="card" style="margin-bottom:18px">
      <div class="row"><h3>Correlación cata vs parámetros</h3><span class="spacer"></span><span class="tiny">#43</span></div>
      <div class="tiny" style="padding:12px 0;color:var(--muted)">Se necesitan al menos 4 lotes catados del mismo tipo para calcular correlaciones estables.</div>
    </div>`;
  }
  return `<div class="card" style="margin-bottom:18px">
    <div class="row"><h3>Correlación cata vs parámetros (Pearson r)</h3><span class="spacer"></span><span class="tiny">#43</span></div>
    ${correlatable.map(({type, batches})=>{
      const tasted = batches.filter(b=>b.tasting?.notaGlobal != null);
      const features = tasted.map(batchFeatures);
      const notes = features.map(f=>f.notaGlobal);
      const vars = [
        {label:'aw final', key:'aw'},
        {label:'yield real %', key:'yieldReal'},
        {label:'sal %', key:'saltPct'},
        {label:'días totales', key:'daysTotal'},
        {label:'T promedio cava', key:'avgT'},
        {label:'HR promedio cava', key:'avgHR'},
        {label:'core T recepción', key:'coreT'},
        {label:'grosor medio', key:'avgThickness'}
      ];
      const rows = vars.map(v=>{
        const xs = features.map(f=>f[v.key]);
        const pr = pearson(xs, notes);
        return { label:v.label, pr };
      }).filter(r => r.pr !== null).sort((a,b)=>Math.abs(b.pr.r) - Math.abs(a.pr.r));
      if(rows.length === 0) return '';
      return `
        <div style="margin-top:14px"><b>${type.name}</b> <span class="tiny" style="color:var(--muted)">· n=${tasted.length} lotes catados</span></div>
        <table style="width:100%;margin-top:6px"><thead><tr><th>Variable</th><th class="r">Pearson r</th><th class="r">n</th><th>Lectura</th></tr></thead><tbody>
          ${rows.map(r=>{
            const absR = Math.abs(r.pr.r);
            let strength = '', color = 'var(--muted)';
            if(absR > 0.7){ strength = r.pr.r>0?'Fuerte +':'Fuerte −'; color = r.pr.r>0?'var(--sage)':'var(--rust)'; }
            else if(absR > 0.4){ strength = r.pr.r>0?'Moderada +':'Moderada −'; color = 'var(--amber)'; }
            else if(absR > 0.2){ strength = 'Débil'; color = 'var(--muted)'; }
            else { strength = 'Ninguna'; color = 'var(--muted)'; }
            return `<tr>
              <td>${r.label}</td>
              <td class="r mono" style="color:${color}">${r.pr.r > 0?'+':''}${r.pr.r.toFixed(2)}</td>
              <td class="r mono tiny">${r.pr.n}</td>
              <td class="tiny" style="color:${color}">${strength}</td>
            </tr>`;
          }).join('')}
        </tbody></table>
      `;
    }).join('')}
    <div class="tiny" style="margin-top:10px;color:var(--muted)">
      Correlación de Pearson entre cada variable y la nota de cata global. |r|&gt;0.7 fuerte · 0.4–0.7 moderada · 0.2–0.4 débil. <b>Nota:</b> correlación no implica causalidad; indica dirección a investigar.
    </div>
  </div>`;
}

                    return `<div style="width:${widthPct}%;background:${stageColors[x.kind]||'#8a8378'};height:100%;position:relative" title="${x.kind}: ${x.lossPct.toFixed(1)}%"><span style="position:absolute;top:50%;left:4px;transform:translateY(-50%);font-size:9px;color:#fff;mix-blend-mode:difference;white-space:nowrap">${x.lossPct>=3?x.kind.slice(0,4)+' '+x.lossPct.toFixed(0)+'%':''}</span></div>`;
                  }).join('')}

                <div class="mono tiny r" style="text-align:right">${total.toFixed(0)}%</div>

            `;
          }).join('')}

  </div>`;
}

/* #48 Analytics estacional */
function renderSeasonalSection(){
  const done = db.batches.filter(b => b.status==='done' && b.startedAt);
  if(done.length < 6){
    return `<div class="card" style="margin-bottom:18px">
      <div class="row"><h3>Tendencias estacionales</h3><span class="spacer"></span><span class="tiny">#48</span></div>
      <div class="tiny" style="padding:12px 0;color:var(--muted)">Se necesitan al menos 6 lotes terminados distribuidos en varios meses para detectar patrones estacionales.</div>
    </div>`;
  }
  // Group by month started
  const byMonth = {};
  done.forEach(b=>{
    const m = new Date(b.startedAt).getUTCMonth()+1;
    if(!byMonth[m]) byMonth[m] = { yields:[], notes:[], n:0 };
    const f = batchFeatures(b);
    byMonth[m].n++;
    if(f.yieldReal !== null) byMonth[m].yields.push(f.yieldReal);
    if(f.notaGlobal !== null) byMonth[m].notes.push(f.notaGlobal);
  });
  const monthNames = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const rows = [];
  for(let m=1; m<=12; m++){
    const d = byMonth[m];
    if(!d) continue;
    const avgY = d.yields.length ? d.yields.reduce((s,v)=>s+v,0)/d.yields.length : null;
    const avgN = d.notes.length ? d.notes.reduce((s,v)=>s+v,0)/d.notes.length : null;
    rows.push({ m, n:d.n, avgY, avgN });
  }
  return `<div class="card" style="margin-bottom:18px">
    <div class="row"><h3>Tendencias estacionales</h3><span class="spacer"></span><span class="tiny">#48</span></div>
    <table style="width:100%;margin-top:8px">
      <thead><tr><th>Mes</th><th class="r">n lotes</th><th class="r">Yield promedio</th><th class="r">Cata promedio</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td class="mono">${monthNames[r.m-1]}</td>
          <td class="r mono tiny">${r.n}</td>
          <td class="r mono">${r.avgY!==null?r.avgY.toFixed(1)+'%':'—'}</td>
          <td class="r mono" style="color:${r.avgN!==null?(r.avgN>=8?'var(--sage)':r.avgN>=6?'var(--amber)':'var(--rust)'):'var(--muted)'}">${r.avgN!==null?r.avgN.toFixed(1)+' / 10':'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div class="tiny" style="margin-top:8px;color:var(--muted)">Promedios por mes del año (agregando todos los años). Diferencias grandes entre meses sugieren efecto climático de tu cava.</div>
  </div>`;
}

/* Overlay chart: % of initial weight vs days from start */
function renderCompareChart(batches, palette){
  const w=720, h=260, pad={l:50, r:20, t:16, b:30};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const maxDays = Math.max(...batches.map(b=>{
    const end = b.finishedAt ? new Date(b.finishedAt) : new Date();
    return (end - new Date(b.startedAt))/(1000*60*60*24);
  }), 30);
  const yMin = 50, yMax = 102;
  const x = (d)=> pad.l + iw * d/maxDays;
  const y = (pct)=> pad.t + ih * (1 - (pct-yMin)/(yMax-yMin));
  const grid = [];
  for(let p=yMin; p<=yMax; p+=10) grid.push(p);
  const polylines = batches.map((b, idx)=>{
    const color = palette[idx%palette.length];
    const totalGreen = b.pieces.reduce((s,p)=>s+p.initialWeight,0);
    const start = new Date(b.startedAt).getTime();
    // Combine all pieces into batch-level by date (take avg of % initial)
    const byDate = {};
    byDate[b.startedAt] = 100;
    b.pieces.forEach(p=>{
      (p.weightLogs||[]).filter(l=>!l.outlier).forEach(l=>{
        const key = l.date;
        if(!byDate[key]) byDate[key] = {sum:0, totalInit:0};
      });
    });
    // Average batch weight per log date (summing all pieces at that date)
    const dateSet = new Set();
    b.pieces.forEach(p=>(p.weightLogs||[]).filter(l=>!l.outlier).forEach(l=>dateSet.add(l.date)));
    const sortedDates = [b.startedAt, ...Array.from(dateSet).sort((a,b)=>new Date(a)-new Date(b))];
    const pts = sortedDates.map(d=>{
      let batchW = 0;
      b.pieces.forEach(p=>{
        if(d === b.startedAt){ batchW += p.initialWeight; return; }
        const logs = (p.weightLogs||[]).filter(l=>!l.outlier).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
        // Find weight at or before d; fallback to initial
        let w = p.initialWeight;
        logs.forEach(l=>{ if(new Date(l.date)<=new Date(d)) w = l.weight; });
        batchW += w;
      });
      const days = (new Date(d) - start)/(1000*60*60*24);
      const pct = 100 * batchW / totalGreen;
      return { days, pct, x: x(days), y: y(pct) };
    });
    const path = pts.length>1 ? 'M '+pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L ') : '';
    const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2" fill="${color}"/>`).join('');
    return `<g>${path?`<path d="${path}" fill="none" stroke="${color}" stroke-width="1.8" opacity="0.9"/>`:''}${dots}</g>`;
  }).join('');
  const legend = batches.map((b, idx)=>{
    const color = palette[idx%palette.length];
    return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:14px;font-size:11px">
      <span style="width:14px;height:2px;background:${color};display:inline-block"></span>
      <span class="mono" style="color:${color}">${b.ref}</span>
    </span>`;
  }).join('');
  return `<div>
    <svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
      ${grid.map(p=>`<line x1="${pad.l}" y1="${y(p)}" x2="${w-pad.r}" y2="${y(p)}" stroke="var(--line)" stroke-width="0.5"/><text x="${pad.l-6}" y="${y(p)+3}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="JetBrains Mono">${p}%</text>`).join('')}
      ${[0, maxDays/4, maxDays/2, maxDays*3/4, maxDays].map(d=>`<text x="${x(d)}" y="${h-pad.b+14}" fill="var(--muted)" font-size="9" text-anchor="middle" font-family="JetBrains Mono">${d.toFixed(0)}d</text>`).join('')}
      ${polylines}
    </svg>
    <div style="margin-top:6px">${legend}</div>
    <div class="tiny" style="color:var(--muted);margin-top:4px">Eje X: días desde inicio del lote (normalizado). Eje Y: % del peso verde inicial. Compara cuán rápido/lento se secó cada lote.</div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════
    v2.0 — BACKUP AUTOMÁTICO
   ═══════════════════════════════════════════════════════════ */

const BACKUP_PREFIX = 'laforet_backup_';
const BACKUP_LAST_KEY = 'laforet_backup_last';

/* Auto-backup: snapshot current db once per calendar day, locally. */
function autoBackup(){
  try{
    const today = toISODate(new Date());
    const last = localStorage.getItem(BACKUP_LAST_KEY);
    if(last === today) return; // already backed up today
    const key = BACKUP_PREFIX + today;
    localStorage.setItem(key, JSON.stringify({ ts: new Date().toISOString(), db }));
    localStorage.setItem(BACKUP_LAST_KEY, today);
    pruneBackups();
  }catch(e){ console.error('autoBackup failed', e); }
}

/* Rotation: keep last 30 days + 1 per month beyond that. */
function pruneBackups(){
  const keys = [];
  for(let i=0; i<localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(BACKUP_PREFIX)) keys.push(k);
  }
  keys.sort(); // ISO dates sort chronologically
  if(keys.length <= 30) return;
  // Keep last 30, then 1 per month for older ones
  const keepLast30 = new Set(keys.slice(-30));
  const older = keys.slice(0, -30);
  const monthKept = {};
  const keepMonthly = new Set();
  for(const k of older){
    const date = k.slice(BACKUP_PREFIX.length);
    const month = date.slice(0, 7); // YYYY-MM
    if(!monthKept[month]){ monthKept[month] = k; keepMonthly.add(k); }
  }
  for(const k of keys){
    if(!keepLast30.has(k) && !keepMonthly.has(k)){
      localStorage.removeItem(k);
    }
  }
}

/* List available backups, sorted newest first. */
function listBackups(){
  const list = [];
  for(let i=0; i<localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(BACKUP_PREFIX)){
      try{
        const data = JSON.parse(localStorage.getItem(k));
        list.push({ key:k, date: k.slice(BACKUP_PREFIX.length), ts: data.ts, size: localStorage.getItem(k).length });
      }catch(e){}
    }
  }
  list.sort((a,b)=> b.date.localeCompare(a.date));
  return list;
}

/* Download most-recent backup (or current db) as JSON. */
function downloadBackup(){
  const list = listBackups();
  const payload = list.length>0 ? JSON.parse(localStorage.getItem(list[0].key)).db : db;
  const date = list.length>0 ? list[0].date : toISODate(new Date());
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `laforet_backup_${date}.json`;
  a.click();
  toast('Backup descargado · '+date);
}

/* Open backup manager modal */
function openBackupModal(){
  const list = listBackups();
  showModal(`
    <div class="modal-head"><h2>Backups automáticos</h2><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <p class="tiny" style="margin-bottom:14px">Snapshot diario automático de todos los datos. Rotación: últimos 30 días + 1 por mes del último año. Los backups viven en este navegador; descargá uno con <b>⬇ JSON</b> para guardarlo externamente.</p>
    <div class="row" style="margin-bottom:14px">
      <button class="btn primary" onclick="downloadBackup()">⬇ Descargar backup más reciente</button>
      <button class="btn" onclick="importDB()">↑ Restaurar desde JSON</button>
    </div>
    ${list.length===0 ? '<div class="empty">Sin backups aún. Se creará uno automáticamente al modificar datos.</div>' :
      '<table style="width:100%"><thead><tr><th>Fecha</th><th>Hora</th><th class="r">Tamaño</th><th class="r">Acciones</th></tr></thead><tbody>'+
      list.map(b=>`<tr>
        <td class="mono">${b.date}</td>
        <td class="tiny">${new Date(b.ts).toLocaleTimeString('es-CO',{timeZone:APP_TZ})}</td>
        <td class="r mono tiny">${(b.size/1024).toFixed(1)} KB</td>
        <td class="r"><button class="btn xs" onclick="restoreBackup('${b.key}')">Restaurar</button></td>
      </tr>`).join('') +
      '</tbody></table>'
    }
  `);
}

/* Restore from a stored backup (with confirmation) */
function restoreBackup(key){
  if(!confirm('Restaurar este backup reemplazará TODOS los datos actuales. ¿Continuar?')) return;
  try{
    const data = JSON.parse(localStorage.getItem(key));
    if(!data || !data.db) throw new Error('backup inválido');
    db = data.db;
    saveDB();
    render();
    closeModal();
    toast('Backup restaurado · '+key.slice(BACKUP_PREFIX.length));
  }catch(e){
    toast('Error al restaurar: '+e.message);
  }
}

function uid(prefix='id'){ return prefix+'_'+Math.random().toString(36).slice(2,10); }
function fmt(n, d=1){ if(n===null||n===undefined||isNaN(n)) return '—'; return Number(n).toLocaleString('es-CO',{maximumFractionDigits:d, minimumFractionDigits: d>0 && n%1!==0 ? Math.min(d,2) : 0}); }
/* Formats weights in grams, auto-switches to kg at >=1kg. For batch totals.
   NEVER use for individual piece weights — use fmtGExact instead. */
function fmtG(n){ if(n===null||n===undefined||isNaN(n)) return '—'; if(n>=1000) return (n/1000).toLocaleString('es-CO',{maximumFractionDigits:2})+' kg'; return Math.round(n).toLocaleString('es-CO')+' g'; }
/* ALWAYS in grams, full precision. Use for individual piece weights where
   losing a few grams of precision matters. */
function fmtGExact(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return Math.round(n).toLocaleString('es-CO')+' g'; }
/* All date formatting locked to America/Bogota so a date picked by the user
   always displays as the same calendar day they chose. */
const APP_TZ = 'America/Bogota';
function fmtDate(d){ if(!d) return '—'; const D = new Date(d); return D.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'2-digit',timeZone:APP_TZ}); }
function fmtDateShort(d){ if(!d) return '—'; const D = new Date(d); return D.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',timeZone:APP_TZ}); }
function daysBetween(a,b){ return Math.floor((new Date(b) - new Date(a))/(1000*60*60*24)); }
/* Parse a "YYYY-MM-DD" string as midnight in Bogota timezone (UTC-5, no DST).
   This way the resulting Date, when later formatted with timeZone:APP_TZ, shows
   the EXACT day the user picked — regardless of the browser's local timezone. */
function parseLocalDate(v){
  if(v instanceof Date) return v;
  if(typeof v !== 'string') return new Date(v);
  const m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m){
    // Build ISO explicitly as midnight Bogota = YYYY-MM-DDT05:00:00Z (Bogota is UTC-5, no DST)
    return new Date(`${m[1]}-${m[2]}-${m[3]}T05:00:00.000Z`);
  }
  return new Date(v);
}
function addDays(d, days){
  // Use UTC math so we don't jump across DST or get wrong results in non-Bogota browsers.
  // Fractional days are rounded, since downstream formatters only show calendar day.
  const x = parseLocalDate(d);
  return new Date(x.getTime() + Math.round(days) * 86400000).toISOString();
}
/* toISODate returns the Bogota calendar date for a Date (not UTC, not whatever
   the browser's local tz is). Preserves the day the user actually picked. */
function toISODate(d){
  const D = (d instanceof Date) ? d : parseLocalDate(d);
  // Use Intl in the Bogota tz to extract y/m/d consistently regardless of browser tz
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: APP_TZ, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(D);
  const y = parts.find(p=>p.type==='year').value;
  const m = parts.find(p=>p.type==='month').value;
  const day = parts.find(p=>p.type==='day').value;
  return `${y}-${m}-${day}`;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._tt); window._tt = setTimeout(()=>t.classList.remove('show'), 2200);
}

// EB interpolation
function ebDays(thicknessCm, shape /*flat|tubular*/, plus20=false){
  if(!thicknessCm || thicknessCm<=0) return 0;
  const col = shape==='flat' ? (plus20?'flat20':'flat') : (plus20?'tub20':'tub');
  const t = Math.max(0.5, Math.min(20, thicknessCm));
  // find surrounding rows
  for(let i=0; i<EB_TABLE.length-1; i++){
    const a = EB_TABLE[i], b = EB_TABLE[i+1];
    if(t>=a.t && t<=b.t){
      const r = (t-a.t)/(b.t-a.t);
      return a[col] + r*(b[col]-a[col]);
    }
  }
  return EB_TABLE[EB_TABLE.length-1][col];
}

function nextRefFor(typeRef){
  // find highest existing sequence
  const used = db.batches.filter(b=>b.typeRef===typeRef).map(b=>parseInt((b.ref||'').replace(typeRef,'')||'0',10)).filter(x=>!isNaN(x));
  const n = used.length? Math.max(...used)+1 : 0;
  return typeRef + String(n).padStart(3,'0');
}

function stageColor(kind){ return `var(--s-${kind==='Curado'?'cur':kind==='Salmuera'?'sal':kind==='Salazon'?'slz':kind==='Adobado'?'ado':kind==='Fermentado'?'fer':kind==='Secado'?'sec':kind==='Balanceo'?'bal':kind==='Ahumado'?'ahum':'mad'})`; }

/* Compute total estimated duration for a type given a piece thickness (for Curado EB) */
function typeTotalDays(type, thicknessCm=null, plus20=true){
  let total = 0;
  for(const s of type.stages){
    if(s.kind==='Curado' && s.eb && thicknessCm){
      total += ebDays(thicknessCm, s.shape||'tubular', plus20);
    } else {
      total += s.dEst || 0;
    }
  }
  return total;
}

/* Skip render if a text input is currently focused (prevents losing focus mid-typing).
   The input's 'change' event on blur will trigger a proper render. */
function renderIfNoFocus(){
  const el = document.activeElement;
  if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
    const type = (el.type||'').toLowerCase();
    if(type !== 'checkbox' && type !== 'radio' && type !== 'range' && type !== 'button' && type !== 'submit'){
      // A typing input is focused — defer render until it blurs
      ensureBlurRender(el);
      return;
    }
  }
  render();
}
/* Attach a one-time blur listener so we render when the user finishes typing. */
function ensureBlurRender(el){
  if(el.dataset.blurRenderAttached) return;
  el.dataset.blurRenderAttached = '1';
  const handler = ()=>{
    delete el.dataset.blurRenderAttached;
    el.removeEventListener('blur', handler);
    render();
  };
  el.addEventListener('blur', handler);
}

/* v2.3.2 — Replace native 'title' tooltips with faster CSS tooltips (~200ms).
   Preserves accessibility via aria-label. Skips form elements where title is
   especially useful for input validation hints. */
function fastTooltips(){
  try{
    document.querySelectorAll('[title]').forEach(el=>{
      const t = el.getAttribute('title');
      if(!t) return;
      // Skip inputs/textareas — browser validation UI may use title
      const tag = el.tagName;
      if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      el.setAttribute('data-tt', t);
      if(!el.getAttribute('aria-label')) el.setAttribute('aria-label', t);
      el.removeAttribute('title'); // suppress native delayed tooltip
    });
    // Flip tooltips near top of viewport to appear below
    document.querySelectorAll('[data-tt]').forEach(el=>{
      const rect = el.getBoundingClientRect();
      if(rect.top < 60) el.setAttribute('data-tt-pos', 'below');
    });
  }catch(e){ /* no-op */ }
}

/* v2.0 — #27 Compute "today's agenda" items across all active batches */
function todaysAgenda(){
  const items = [];
  const now = Date.now();
  const activeBatches = db.batches.filter(b=>b.status==='in_progress');
  activeBatches.forEach(b=>{
    const sec = findSecadoStage(b);
    // A stage is "truly active" only if it has started AND today is at/past that start AND it's not done
    const secActive = sec && sec.startedAt && new Date(sec.startedAt).getTime() <= now && !sec.done;
    // Pesajes vencidos (>7d sin registro durante Secado) — solo cuando Secado realmente arrancó
    if(secActive){
      b.pieces.forEach(p=>{
        const logs = (p.weightLogs||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
        const latest = logs[0];
        const secStartMs = new Date(sec.startedAt).getTime();
        // Base de referencia: último log o el inicio de Secado (lo que sea más reciente)
        const refMs = latest ? Math.max(new Date(latest.date).getTime(), secStartMs) : secStartMs;
        const daysSince = Math.floor((now - refMs)/(1000*60*60*24));
        const safety = safetyStatus(b, p);
        if(safety.ready) return;
        if(daysSince >= 7){
          items.push({ kind:'weigh', urgency: daysSince, batchId:b.id, pieceId:p.id,
                       label: `Pesar ${p.code} (${b.ref})`, note: latest ? `${daysSince}d sin registro` : `${daysSince}d desde inicio Secado · sin registros aún` });
        }
      });
    }
    // Piezas en objetivo listas (aw cumplido pero stage sin cerrar) — también requiere Secado activo
    if(secActive){
      b.pieces.forEach(p=>{
        const safety = safetyStatus(b, p);
        if(safety.aw!==null && safety.aw <= safety.awTarget){
          items.push({ kind:'ready', urgency: 100, batchId:b.id, pieceId:p.id,
                       label: `${p.code} en objetivo (${b.ref})`, note: `aw ${safety.aw.toFixed(3)} ≤ ${safety.awTarget.toFixed(2)} · considerá avanzar etapa` });
        }
      });
    }
    // PCCs: receiving sin core T registrada
    if(!b.receiving || b.receiving.coreT===null || b.receiving.coreT===undefined){
      items.push({ kind:'pcc', urgency: 90, batchId:b.id,
                   label: `${b.ref} sin core T de recepción`, note: 'PCC HACCP #22 pendiente' });
    } else if(b.receiving.coreT > 4 && b.receiving.acceptance==='pending'){
      items.push({ kind:'pcc', urgency: 95, batchId:b.id,
                   label: `${b.ref} recepción con T>4°C sin decisión`, note: 'Documentar aceptar/rechazar' });
    }
    // Fermentación: pH no registrado en 24h — solo si Fermentado realmente arrancó
    const fermStage = (b.stages||[]).find(s=>s.kind==='Fermentado' && !s.done && s.startedAt && new Date(s.startedAt).getTime() <= now);
    if(fermStage){
      const hoursInFerm = (now - new Date(fermStage.startedAt).getTime())/(1000*60*60);
      const phLogs = (b.phLogs||[]).filter(l=>l.stageKind==='Fermentado');
      const latestPh = phLogs.sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      if(hoursInFerm > 24 && (!latestPh || latestPh.ph > 5.3)){
        items.push({ kind:'ferm', urgency: 110, batchId:b.id,
                     label: `⚠ Fermentación ${b.ref}: pH ${latestPh?latestPh.ph:'no registrado'}`, note: hoursInFerm.toFixed(0)+'h en fermentación · pH debe caer <5.3' });
      }
    }
    // Etapas vencidas
    const cs = currentStage(b);
    if(cs && cs.expectedEnd){
      const eta = daysBetween(new Date(), cs.expectedEnd);
      if(eta < 0){
        items.push({ kind:'stage', urgency: 80 + Math.min(20, -eta), batchId:b.id,
                     label: `${cs.kind} de ${b.ref} vencida`, note: `${-eta}d vencida · revisar/avanzar` });
      }
    }
    // v2.1 #18 — Danger Zone contextual por etapa (usa envLog Govee).
    // Solo evaluar si la etapa actual realmente arrancó (startedAt <= now).
    const csActive = cs && cs.startedAt && new Date(cs.startedAt).getTime() <= now;
    const envStage = csActive ? envStats(b, cs.kind) : null;
    if(envStage && envStage.avgT !== null){
      const avgT = envStage.avgT;
      if(cs.kind === 'Curado' && avgT > 6){
        items.push({ kind:'danger', urgency: 115, batchId:b.id,
                     label: `⚠ ${b.ref}: Curado a ${avgT.toFixed(1)}°C`, note: `Promedio sobre 6°C — sal aún difundiendo con aw alta` });
      } else if((cs.kind === 'Secado' || cs.kind === 'Madurado')){
        // Alert if avg T > target+5 AND at least one piece still vulnerable (aw > 0.90)
        const target = 13;
        const vulnerable = b.pieces.some(p=>{
          const s = safetyStatus(b, p);
          return s.aw !== null && s.aw > 0.90;
        });
        if(avgT > target + 5 && vulnerable){
          items.push({ kind:'danger', urgency: 112, batchId:b.id,
                       label: `⚠ ${b.ref}: ${cs.kind} a ${avgT.toFixed(1)}°C con pieza vulnerable`, note: `Deriva >5°C sobre target 13°C y hay pieza con aw>0.90` });
        }
      }
    }
    // Recepción con core T > 4°C alerta más fuerte
    if(b.receiving && b.receiving.coreT !== null && b.receiving.coreT > 4){
      items.push({ kind:'danger', urgency: 108, batchId:b.id,
                   label: `${b.ref}: recibido a ${(+b.receiving.coreT).toFixed(1)}°C`, note: 'Core T sobre umbral HACCP — procesar hoy o descartar' });
    }
    // v2.2 #16 — HACCP critical PCC failures
    if(typeof evaluateHaccp === 'function'){
      const hac = evaluateHaccp(b);
      hac.results.filter(r=>r.status==='fail').forEach(r=>{
        const sev = r.pcc.severity==='critical' ? 120 : 95;
        items.push({ kind:'pcc-fail', urgency: sev, batchId:b.id,
                     label: `${b.ref}: ${r.pcc.label}`, note: `PCC violado · ${r.detail}` });
      });
    }
    // Case hardening: alerta si Secado realmente arrancó con VPD alto
    const secCh = findSecadoStage(b);
    const secChActive = secCh && secCh.startedAt && new Date(secCh.startedAt).getTime() <= now && !secCh.done;
    if(secChActive){
      const thickest = b.pieces.reduce((a,b)=> (a.thickness||0)>(b.thickness||0)?a:b, b.pieces[0]);
      if(thickest){
        const r = caseHardeningRisk(b, thickest);
        if(r && r.risk){
          items.push({ kind:'ch', urgency: 85, batchId:b.id,
                       label: `${b.ref}: posible case hardening`, note: r.msg });
        }
      }
    }
  });
  // Sort by urgency desc
  items.sort((a,b)=> b.urgency - a.urgency);
  return items;
}

      </div>

    </div>
    ${active.length===0 ? emptyState('Sin lotes activos','Crea un nuevo lote para comenzar.') : renderGantt(active)}
  `;
  return html;
}

function renderGantt(batches){
  const starts = batches.map(b=>new Date(b.startedAt));
  const ends = batches.map(b=>{
    const s = b.stages[b.stages.length-1];
    return new Date(s.actualEnd || s.expectedEnd || s.startedAt || b.startedAt);
  });
  const today = new Date();
  const minD = new Date(Math.min(...starts, today) - 3*86400000);
  const maxD = new Date(Math.max(...ends, today.getTime() + 7*86400000) + 3*86400000);
  const totalMs = maxD - minD;
  const pxPerDay = 14;
  const daysSpan = totalMs / 86400000;
  const bodyWidth = Math.max(900, daysSpan * pxPerDay);

  // Monthly ticks (clearer than weekly for long processes)
  const scaleTicks = [];
  const tickD = new Date(minD.getFullYear(), minD.getMonth(), 1);
  while(tickD < maxD){
    scaleTicks.push({ pct: 100 * (tickD-minD)/totalMs, label: tickD.toLocaleDateString('es-CO',{month:'short',year:'2-digit',timeZone:APP_TZ}) });
    tickD.setMonth(tickD.getMonth()+1);
  }
  const todayPct = 100 * (today-minD)/totalMs;

  // Legend differentiating REAL vs PROYECTADO
  const legendRE = `
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)">
      <span style="display:inline-flex;align-items:center;gap:6px"><span style="display:inline-block;width:28px;height:12px;background:var(--sage);border-radius:2px"></span>REAL (ejecutado)</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><span style="display:inline-block;width:28px;height:12px;background:repeating-linear-gradient(135deg,var(--sage) 0 4px,transparent 4px 8px);border:1px dashed var(--sage);border-radius:2px;opacity:0.65"></span>PROYECTADO (estimado)</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><span style="display:inline-block;width:2px;height:16px;background:var(--brand);box-shadow:0 0 4px var(--brand)"></span>HOY</span>
    </div>
  `;

  return `
    ${legendRE}
    <div class="gantt">
      <div class="gantt-scroll">
        <div style="width:${bodyWidth+240}px;position:relative">
          <div class="gantt-scale" style="position:relative;height:22px;margin-left:240px">
            ${scaleTicks.map(t=>`<span class="tick" style="position:absolute;left:${t.pct}%;top:0;transform:translateX(-50%);font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace">${t.label}</span>`).join('')}
          </div>
          <div class="gantt-body">
          ${batches.map(b=>`
            <div class="gantt-row">
              <div class="gantt-label">
                <div class="p">${b.typeName}</div>
                <div class="r">${b.ref} · ${fmtG(b.pieces.reduce((s,p)=>s+p.initialWeight,0))}</div>
              </div>
              <div class="gantt-track" onclick="goto('batch-detail',{batchId:'${b.id}'})" style="cursor:pointer;position:relative">
                ${b.stages.map(s=>{
                  const kindColor = stageColor(s.kind);
                  const stageStart = new Date(s.startedAt || b.startedAt);
                  // Three cases:
                  // 1. Stage done → entire bar is REAL (startedAt → actualEnd)
                  // 2. Stage in progress (started but not done) → split into REAL (start → min(today, expectedEnd)) + PROYECTADO (today → expectedEnd)
                  // 3. Stage future (startedAt in the future) → entire bar is PROYECTADO
                  const bars = [];
                  if(s.done){
                    const stageEnd = new Date(s.actualEnd || s.expectedEnd || stageStart);
                    bars.push({ kind:'real', start: stageStart, end: stageEnd, label: s.kind });
                  } else {
                    const expectedEnd = new Date(s.expectedEnd || stageStart);
                    if(stageStart > today){
                      // All future
                      bars.push({ kind:'proj', start: stageStart, end: expectedEnd, label: s.kind });
                    } else if(expectedEnd <= today){
                      // Overdue — all real but overdue
                      bars.push({ kind:'overdue', start: stageStart, end: today, label: s.kind });
                    } else {
                      // Split: real up to today, proj from today onward
                      bars.push({ kind:'real', start: stageStart, end: today, label: s.kind });
                      bars.push({ kind:'proj', start: today, end: expectedEnd, label: '' });
                    }
                  }
                  return bars.map(bar=>{
                    const left = 100 * (bar.start - minD) / totalMs;
                    const width = Math.max(0.5, 100 * (bar.end - bar.start) / totalMs);
                    const title = `${s.kind} · ${bar.kind.toUpperCase()} · ${fmtDate(bar.start)} → ${fmtDate(bar.end)}`;
                    let style;
                    if(bar.kind==='real'){
                      style = `left:${left}%;width:${width}%;background:${kindColor};border:1px solid ${kindColor};color:#fff`;
                    } else if(bar.kind==='overdue'){
                      style = `left:${left}%;width:${width}%;background:${kindColor};border:2px solid var(--rust);color:#fff;box-shadow:0 0 6px rgba(167,94,58,0.5)`;
                    } else {
                      style = `left:${left}%;width:${width}%;background:repeating-linear-gradient(135deg,${kindColor} 0 4px,transparent 4px 8px);border:1px dashed ${kindColor};opacity:0.72;color:${kindColor}`;
                    }
                    return `<div class="gantt-seg" title="${title}" style="${style}">${width>4?bar.label:''}</div>`;
                  }).join('');
                }).join('')}
                <div class="today" style="left:${todayPct}%;background:var(--brand);box-shadow:0 0 4px var(--brand);width:2px"></div>
              </div>
            </div>
          `).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

function currentStage(b){
  if(!b || !b.stages) return null;
  return b.stages.find(s=>!s.done) || null;
}
function latestWeight(b){
  // sum of latest weight of each piece; undefined if no piece has any log
  const anyLog = b.pieces.some(p=>(p.weightLogs||[]).length>0);
  if(!anyLog) return undefined;
  return b.pieces.reduce((s,p)=> s + latestPieceWeight(p), 0);
}
function batchProgressPct(b){
  const total = b.stages.length;
  const doneCount = b.stages.filter(s=>s.done).length;
  const cs = currentStage(b);
  let extra = 0;
  if(cs){
    const start = new Date(cs.startedAt || b.startedAt);
    const end = new Date(cs.expectedEnd || cs.startedAt);
    const now = new Date();
    if(end>start) extra = Math.min(1, Math.max(0, (now-start)/(end-start)));
  }
  return Math.min(100, 100*(doneCount+extra)/total);
}

/* v2.1 #08 — Case hardening banner at batch level (worst case across pieces) */
function renderCaseHardeningBanner(b){
  // Only during Secado/Madurado
  const sec = findSecadoStage(b);
  if(!sec || sec.done || !sec.startedAt) return '';
  if(!b.envLog || b.envLog.length===0) return '';
  // Compute risk for the thickest piece (worst case)
  const thickest = b.pieces.reduce((a,b)=> (a.thickness||0)>(b.thickness||0)?a:b, b.pieces[0]);
  if(!thickest) return '';
  const risk = caseHardeningRisk(b, thickest);
  if(!risk || !risk.risk) return '';
  return `<div style="background:rgba(176,148,104,0.1);border:1px solid var(--amber);border-left:3px solid var(--amber);border-radius:4px;padding:10px 14px;margin:14px 0;color:var(--amber)">
    <div style="font-weight:600;margin-bottom:4px">⚠ Riesgo de case hardening (pieza más gruesa ${thickest.thickness}cm)</div>
    <div class="tiny" style="color:var(--ink-2)">${risk.msg}. Promedio actual: T ${risk.avgT.toFixed(1)}°C · HR ${risk.avgHR.toFixed(0)}% · VPD ${risk.vpd.toFixed(2)} kPa (umbral seguro ~${risk.safeVpd.toFixed(2)} kPa). Secado superficial supera migración interna → costra que atrapa humedad adentro.</div>
  </div>`;
}

/* v2.3 — #42 Historical yield hint in new batch modal */
function renderHistoricalYieldHint(type, currentTarget){
  const stats = historicalYieldStats(type.id);
  if(stats.n === 0) return '';
  const delta = stats.mean - currentTarget;
  if(Math.abs(delta) < 1) return `<div class="tiny" style="color:var(--sage);margin-top:4px">✓ Tu histórico ${stats.mean.toFixed(1)}% (n=${stats.n}) coincide con el objetivo.</div>`;
  const sign = delta < 0 ? 'pierdes más' : 'pierdes menos';
  const color = Math.abs(delta) > 3 ? 'var(--amber)' : 'var(--muted)';
  return `<div class="tiny" style="color:${color};margin-top:4px">
    Histórico tipo: <b>${stats.mean.toFixed(1)}%</b> ±${stats.std.toFixed(1)} (n=${stats.n}) · ${sign} ${Math.abs(delta).toFixed(1)}pp.
    <a onclick="window._newBatch.targetYield=${Math.round(stats.mean)};renderNewBatchModal()" style="color:var(--brand);cursor:pointer;margin-left:4px">Usar ${Math.round(stats.mean)}% histórico</a>

}
