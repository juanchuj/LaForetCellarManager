        ${Math.abs(mb.unexplainedG) > 0.5 ? `<tr><td class="tiny" style="color:${balanceColor}">${mb.unexplainedG > 0 ? '− Merma inexplicada' : '+ Excedente'} (drip, moho descartado, error)</td><td class="r mono" style="color:${balanceColor}">${mb.unexplainedG > 0 ? '−' : '+'}${fmtG(Math.abs(mb.unexplainedG))}</td><td class="r mono tiny" style="color:${balanceColor}">${mb.unexplainedPct > 0 ? '−' : '+'}${Math.abs(mb.unexplainedPct).toFixed(2)}%</td></tr>` : ''}
        <tr style="border-top:1px solid var(--line)"><td><b>Peso actual medido</b></td><td class="r mono"><b>${fmtG(mb.currentG)}</b></td><td class="r mono tiny" style="color:var(--brand)"><b>${pctCurrentOfGreen.toFixed(1)}%</b></td></tr>
      </tbody>
    </table>
    <div class="tiny" style="margin-top:8px;color:var(--muted)">
      <b>Fórmula:</b> verde + sal añadida = actual + agua evaporada + merma. Si la merma supera ±2% hay posible error de medición o pérdidas no documentadas.
    </div>
  </div>`;
}

function timeStatusForStage(s){
  if(s.done) return { level:'gray', label:'Terminada', pct:100 };
  if(!s.startedAt || !s.expectedEnd) return { level:'gray', label:'Sin fechas', pct:0 };
  const start = new Date(s.startedAt).getTime();
  const end = new Date(s.expectedEnd).getTime();
  const now = Date.now();
  const total = end - start;
  const elapsed = now - start;
  const pct = total>0? (elapsed/total)*100 : 0;
  if(pct >= 100) return { level:'green', label:'Lista · pasar a siguiente', pct };
  if(pct >= 80) return { level:'yellow', label:'Casi lista', pct };
  return { level:'red', label:'En proceso', pct };
}

/* Per-piece weight helpers */
function latestPieceWeight(piece){
  const logs = (piece.weightLogs||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  return logs[0]?.weight ?? piece.initialWeight;
}
/* Find the active (or primary) Secado stage for a batch */
function findSecadoStage(b){
  if(!b || !b.stages) return null;
  // Prefer the first in-progress Secado stage
  let s = b.stages.find(st=>st.kind==='Secado' && st.startedAt && !st.done);
  if(s) return s;
  // Fallback: first Secado stage (may be done or not yet started)
  return b.stages.find(st=>st.kind==='Secado') || null;
}
/* Effective loss target % for a batch: per-batch override on the Secado stage,
   or fall back to (100 - batch.targetYield) */
function batchLossTargetPct(b){
  const s = findSecadoStage(b);
  if(s && typeof s.lossTargetPct === 'number' && s.lossTargetPct > 0) return s.lossTargetPct;
  return 100 - (b.targetYield || 60);
}
/* Start weight for a piece at the beginning of Secado.
   Priority: explicit stage.startWeights[pieceId] > earliest weightLog > null. */
function pieceStartWeight(b, piece){
  const s = findSecadoStage(b);
  // Priority 1: explicit registration via Iniciar Secado modal
  if(s && s.startWeights){
    const w = s.startWeights[piece.id];
    if(w && w > 0) return w;
  }
  // Priority 2: earliest weight log for this piece (chronological first)
  const logs = (piece.weightLogs||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(logs.length > 0 && logs[0].weight > 0) return logs[0].weight;
  return null;
}
/* True if the start weight came from an explicit Iniciar Secado registration */
function pieceStartWeightExplicit(b, piece){
  const s = findSecadoStage(b);
  if(!s || !s.startWeights) return false;
  const w = s.startWeights[piece.id];
  return !!(w && w > 0);
}
/* Target weight for a piece.
   Formula: target = startW * (1 - lossPct/100)
   Where lossPct is the batch-level loss target % (e.g. 30% loss = 70% target).
   startW comes from pieceStartWeight (explicit or earliest log).
   Only if there is NO log at all, we fall back to greenWeight * (1 - lossPct/100). */
function pieceTargetWeight(b, piece){
  const lossPct = batchLossTargetPct(b);
  const startW = pieceStartWeight(b, piece);
  if(startW) return startW * (1 - lossPct/100);
  // Last-resort fallback: green weight (BEFORE any curing loss)
  return (1 - lossPct/100) * piece.initialWeight;
}
/* Returns true if the batch has a Secado stage that has started AND
   at least one piece has NO weight logs AND no startWeight — only
   then do we require the formal start weight registration. If pieces
   already have weight logs, the earliest log is used as the baseline. */
function needsSecadoStartWeights(b){
  const s = findSecadoStage(b);
  if(!s || !s.startedAt) return false;
  return b.pieces.some(p => !pieceStartWeight(b, p));
}
/* Exponential decay fit for a drying piece.
   Model: W(t) = Wtarget + (W0 - Wtarget) * exp(-k * t)
   where t is days since the first (start) measurement, W0 is start weight.
   Given a list of {t, w} samples, solve for k via least-squares in log space.
   Returns { k, days remaining, estCompletion (Date), hasEnough } */
function fitExpDecay(samples, Wtarget){
  if(!samples || samples.length < 2 || !Wtarget) return { hasEnough:false };
  const W0 = samples[0].w;
  if(W0 <= Wtarget) return { hasEnough:true, k:0, daysRemaining:0, pctComplete:100 };
  // Transform: let y = (W - Wtarget) / (W0 - Wtarget). Then y = exp(-k*t)
  // => ln(y) = -k * t. Linear regression through origin, t vs -ln(y).
  const points = samples.map(s=>{
    const y = (s.w - Wtarget) / (W0 - Wtarget);
    return { t: s.t, lny: y > 0 ? Math.log(y) : null };
  }).filter(p=>p.lny !== null && isFinite(p.lny) && p.t > 0);
  if(points.length < 1) return { hasEnough:false };
  // #11 v2.1 — WEIGHTED least squares with recency bias.
  // Weight: the latest 3 samples get 2× weight; critical because at 70-90%
  // progress the drying asymptotes and early samples would otherwise dominate k.
  const N = points.length;
  const weighted = points.map((p, i)=>{
    const isRecent = i >= Math.max(0, N - 3);
    return { ...p, w: isRecent ? 2 : 1 };
  });
  let num = 0, den = 0;
  for(const p of weighted){ num += p.w * p.t * p.lny; den += p.w * p.t * p.t; }
  if(den === 0) return { hasEnough:false };
  const k = -num / den;
  if(k <= 0) return { hasEnough:false, k, note:'La pieza no esta perdiendo peso' };
  // Current state: latest sample
  const last = samples[samples.length-1];
  const Wnow = last.w;
  // Days from NOW to reach target: solve W(t_total) = Wtarget with threshold W_target * 1.01
  // t_total = -ln((W_threshold - Wtarget)/(W0 - Wtarget)) / k
  const Wthreshold = Wtarget * 1.01;  // 1% tolerance
  const yThreshold = (Wthreshold - Wtarget) / (W0 - Wtarget);
  if(yThreshold <= 0) return { hasEnough:true, k, daysRemaining:0, pctComplete:100 };
  const tTotal = -Math.log(yThreshold) / k;
  const daysRemaining = Math.max(0, tTotal - last.t);
  // % complete based on weight-loss progress
  const totalLoss = W0 - Wtarget;
  const doneLoss = W0 - Wnow;
  const pctComplete = totalLoss > 0 ? Math.min(100, (doneLoss/totalLoss)*100) : 0;
  return { hasEnough:true, k, daysRemaining, pctComplete, tTotal, Wnow };
}
/* Build samples {t, w} for a piece's Secado logs (days since Secado start).
   Excludes entries marked as outlier (user-flagged) from the fit. */
function pieceSecadoSamples(b, piece){
  const s = findSecadoStage(b);
  if(!s || !s.startedAt || !s.startWeights) return [];
  const startW = s.startWeights[piece.id];
  if(!startW) return [];
  const startTime = new Date(s.startedAt).getTime();
  const samples = [{ t: 0, w: startW, date: s.startedAt }];
  (piece.weightLogs||[]).forEach(l=>{
    if(l.outlier) return; // #12: exclude flagged outliers from the fit
    const t = (new Date(l.date).getTime() - startTime) / (1000*60*60*24);
    if(t > 0) samples.push({ t, w: l.weight, date: l.date });
  });
  samples.sort((a,b)=>a.t - b.t);
  return samples;
}
/* Full estimation for a piece: current weight, target, progress, est completion date */
function pieceEstimation(b, piece){
  const s = findSecadoStage(b);
  if(!s || !s.startedAt) return null;
  const target = pieceTargetWeight(b, piece);
  const samples = pieceSecadoSamples(b, piece);
  if(samples.length < 2){
    return { target, samples, hasEnough:false, note: samples.length<1 ? 'Falta registro inicial de Secado' : 'Falta al menos una medicion mas' };
  }
  const fit = fitExpDecay(samples, target);
  if(!fit.hasEnough) return { target, samples, hasEnough:false, note: fit.note || 'Datos insuficientes' };
  const now = new Date();
  const estCompletion = new Date(now.getTime() + fit.daysRemaining * 24*60*60*1000);
  return { target, samples, hasEnough:true, ...fit, estCompletion };
}
function weightStatusForPiece(b, piece){
  const target = pieceTargetWeight(b, piece);
  const current = latestPieceWeight(piece);
  const startW = pieceStartWeight(b, piece) || piece.initialWeight;
  const totalLoss = startW - target;
  const doneLoss = startW - current;
  const pct = totalLoss>0? (doneLoss/totalLoss)*100 : 0;
  const deltaPct = target>0 ? ((current-target)/target)*100 : 0;
  const hasLog = (piece.weightLogs||[]).length > 0;
  if(!hasLog) return { level:'gray', label:'Sin registro', current, target, pct:0, deltaPct, hasLog, needsStart:true };
  if(current <= target*1.02) return { level:'green', label:'Peso objetivo alcanzado', current, target, pct, deltaPct, hasLog };
  if(current <= target*1.05) return { level:'yellow', label:'Cerca del objetivo', current, target, pct, deltaPct, hasLog };
  return { level:'red', label:'Aún secando', current, target, pct, deltaPct, hasLog };
}
/* Aggregated status for the whole batch (worst-of-pieces) */
function weightStatusForBatch(b){
  // Sum of per-piece targets uses the new piece-based target (stage start * (1-loss))
  const target = b.pieces.reduce((s,p)=>s + pieceTargetWeight(b,p), 0);
  const startW = b.pieces.reduce((s,p)=> s + (pieceStartWeight(b,p) || p.initialWeight), 0);
  const current = b.pieces.reduce((s,p)=>s+latestPieceWeight(p),0);
  const totalLoss = startW - target;
  const doneLoss = startW - current;
  const pct = totalLoss>0? (doneLoss/totalLoss)*100 : 0;
  const deltaPct = target>0 ? ((current-target)/target)*100 : 0;
  const levels = b.pieces.map(p=>weightStatusForPiece(b,p).level);
  const order = {red:3, yellow:2, green:1, gray:0};
  const worst = levels.reduce((w,l)=> order[l]>order[w]?l:w, 'gray');
  const labels = {red:'Aún secando', yellow:'Cerca del objetivo', green:'Peso objetivo alcanzado', gray:'Pendiente iniciar o sin registros'};
  return { level:worst, label:labels[worst], current, target, pct, deltaPct };
}
/* Batch-level "latest measurement date" = most recent across all pieces */
function latestBatchMeasurementDate(b){
  let latest = null;
  b.pieces.forEach(p=> (p.weightLogs||[]).forEach(l=>{
    const t = new Date(l.date).getTime();
    if(latest===null || t>latest) latest = t;
  }));
  return latest;
}
/* MIGRATION: legacy b.weightLogs → distribute to first piece (best-effort) */
function migrateBackfillBrineOnBatches(){
  // For batches created before build14, the Curado stage may be missing brine.
  // Try to backfill from the parent type. If not available, use a sensible default.
  let touched = false;
  (db.batches||[]).forEach(b=>{
    const parentType = (db.types||[]).find(t=>t.id===b.typeId);
    (b.stages||[]).forEach((s, si)=>{
      if(s.kind==='Curado' && !s.brine){
        let src = null;
        if(parentType && parentType.stages){
          // Find the corresponding Curado stage in the type (same index or first Curado)
          src = parentType.stages[si] && parentType.stages[si].kind==='Curado'
            ? parentType.stages[si]
            : parentType.stages.find(x=>x.kind==='Curado');
        }
        if(src && src.brine){
          s.brine = {
            saltPct: src.brine.saltPct,
            waterPct: src.brine.waterPct,
            saltIngredient: src.brine.saltIngredient,
            cureSalt: src.brine.cureSalt ? { ...src.brine.cureSalt } : { ingredient:null, gPerKg:0 }
          };
        } else {
          s.brine = { saltPct:2.8, waterPct:0, saltIngredient: defaultCommonSaltName(), cureSalt:{ ingredient:null, gPerKg:0 } };
        }
        // Also backfill shape/eb if missing
        if(s.shape===undefined && src) s.shape = src.shape || 'tubular';
        if(s.eb===undefined && src) s.eb = src.eb || false;
        touched = true;
      }
    });
  });
  if(touched){ console.log('Brine backfilled on existing batches'); saveDB(); }
}
function migrateStripSaltFromCureBatches(){
  let touched = false;
  (db.batches||[]).forEach(b=>{
    (b.stages||[]).forEach(s=>{
      if(s.kind==='Curado' && Array.isArray(s.recipe)){
        const before = s.recipe.length;
        s.recipe = s.recipe.filter(r=>{
          const ing = db.ingredients.find(x=>x.name===r.ingredient);
          return !ing || (ing.category!=='sal' && ing.category!=='sal-curado');
        });
        if(s.recipe.length !== before) touched = true;
      }
    });
  });
  if(touched){ console.log('Sales removidas de recetas de curado en lotes activos'); saveDB(); }
}
function migrateWeightLogsToPieces(){
  let migrated = 0;
  (db.batches||[]).forEach(b=>{
    // ensure every piece has code + weightLogs
    (b.pieces||[]).forEach((p,i)=>{
      if(!p.weightLogs) p.weightLogs = [];
      if(!p.code) p.code = (b.ref||'LOTE') + String.fromCharCode(65+i);
    });
    // if legacy batch-level weightLogs exist, move them to piece #0 as approximation
    if(Array.isArray(b.weightLogs) && b.weightLogs.length>0 && b.pieces && b.pieces.length>0){
      const totalW = b.pieces.reduce((s,p)=>s+p.initialWeight,0);
      const p0 = b.pieces[0];
      b.weightLogs.forEach(l=>{
        // scale legacy total-batch weight down to piece 0's proportion
        const scaled = l.weight * (p0.initialWeight/totalW);
        p0.weightLogs.push({
          id: uid('wl'),
          date: l.date,
          weight: Math.round(scaled),
          note: (l.note||'') + ' [migrado del lote]'
        });
      });
      migrated++;
      delete b.weightLogs;
    }
  });
  if(migrated>0){ console.log('Migrados', migrated, 'lotes a peso-por-pieza'); saveDB(); }
}

function renderStageCard(b, s, idx){

  const isCurrent = !s.done && b.stages.findIndex(x=>!x.done)===idx;

  const start = s.startedAt? new Date(s.startedAt) : null;
  const end = s.expectedEnd? new Date(s.expectedEnd) : null;
  const days = start && end ? daysBetween(start,end) : s.dEst;
  const daysLeft = end && !s.done ? daysBetween(new Date(), end) : null;
  const timeSt = timeStatusForStage(s);
  const weightSt = (isCurrent && (s.kind==='Secado'||s.kind==='Madurado')) ? weightStatusForBatch(b) : null;

  return `
    <div class="stage-card ${status}">
      <div class="sh">
        <span class="sd ${s.kind}"></span>
        <span class="idx">E${idx+1}</span>
        <span class="n">${s.kind}</span>
        <span class="spacer"></span>
        ${s.done?'<span class="pill sage">Terminada</span>':isCurrent?`<span class="al ${timeSt.level}"><span class="dot-al"></span>${timeSt.label}</span>`:'<span class="pill muted">Pendiente</span>'}
      </div>
      <div class="grid grid-4" style="gap:10px;margin-bottom:8px">
        <div><div class="tiny">Inicio</div><div class="mono">${fmtDate(start)}</div></div>
        <div><div class="tiny">Fin estimado</div><div class="mono">${fmtDate(end)}</div></div>
        <div><div class="tiny">Duración</div><div class="mono">${days? fmt(days,1)+' d':'—'}</div></div>
        <div><div class="tiny">${s.done?'Terminada':'Faltan / progreso'}</div><div>${s.done?`<span class="mono">${fmtDate(s.actualEnd||end)}</span>`:`<span class="al ${timeSt.level}" title="${Math.round(timeSt.pct)}%">${daysLeft===null?'—':(daysLeft<0? (-daysLeft)+' d vencido':daysLeft+' d')}</span>`}</div></div>
      </div>
      ${weightSt ? `
        <div class="row" style="gap:12px;margin-bottom:8px;flex-wrap:wrap">
          <span class="al ${weightSt.level}">Peso actual ${fmtG(weightSt.current)} · objetivo ${fmtG(weightSt.target)} (${weightSt.deltaPct>=0?'+':''}${fmt(weightSt.deltaPct,1)}%)</span>
          <span class="tiny">${weightSt.label}</span>
        </div>` : ''}

      ${(s.recipe && s.recipe.length) || (s.kind==='Curado' && s.brine) ? (()=>{
        const totalKg = b.pieces.reduce((sm,p)=>sm+p.initialWeight,0)/1000;
        const totalG = totalKg * 1000;
        const isCurado = s.kind==='Curado' && s.brine;
        let brineRows = '';
        if(isCurado){
          const meatG = totalG;
          const rB = calcEqBrine(meatG, s.brine.saltPct, s.brine.waterPct, s.brine.saltIngredient, s.brine);
          brineRows = `
            <div class="rt auto-row">
              <span class="n">${s.brine.saltIngredient||'Sal comun'} <span class="auto-badge">EQ Brine</span></span>
              <span class="a">${fmt(rB.commonG,2)}<span class="u">g</span></span>
            </div>
            ${rB.cureG>0 && rB.cureIng ? `<div class="rt auto-row">
              <span class="n">${rB.cureIng.name} <span class="auto-badge">EQ Brine</span></span>
              <span class="a">${fmt(rB.cureG,2)}<span class="u">g</span></span>
            </div>` : ''}
            ${rB.waterG>0 ? `<div class="rt auto-row">
              <span class="n">Agua destilada <span class="auto-badge">EQ Brine</span></span>
              <span class="a">${fmt(rB.waterG,0)}<span class="u">ml</span></span>
            </div>` : ''}
          `;
        }
        const recipeRows = (s.recipe||[]).map(r=>{
          const ing = db.ingredients.find(i=>i.name===r.ingredient);
          const amount = r.amount * totalKg;
          const unit = normalizeUnit(ing?.unit||'g');
          return `<div class="rt"><span class="n">${r.ingredient}${r.note?' <span class="tiny">('+r.note+')</span>':''}</span><span class="a">${fmt(amount,2)}<span class="u">${unit}</span></span></div>`;
        }).join('');
        return `
          <div class="divider-lbl">Receta escalada &middot; sobre ${fmtG(totalG)} (${fmt(totalKg,2)} kg) de carne</div>
          <div class="recipe-scaled" style="margin-top:0">
            ${brineRows}
            ${recipeRows}

        `;
      })() : ''}

      ${s.kind==='Curado' && s.brine ? renderBrineForStage(b, s) : ''}
      ${s.inoc? renderInoculantForStage(b, s) : ''}

    </div>
  `;
}

    ${alertMsg}

    <div class="tiny" style="margin-top:6px">Formula: Sal_total = (carne + agua) x %/100. La sal comun compensa el NaCl que aporta la sal de cura. Mezclar todas las sales, empacar al vacio, refrigerar a 1-4 C. Voltear cada 12 h.</div>
  `;
}
/* Residual panel: shows ingoing vs residual after full process,
   plus a small decay curve SVG. */
function renderResidualPanel(res, totalDays, ingoingNitrite, ingoingNitrate){
  const isLong = totalDays >= 30;
  const nitriteSafeResidual = res.residualNitrite <= 50;   // most regulations cap residual at 50-80 ppm
  const nitrateSafeResidual = res.residualNitrate <= 200;
  const level = (nitriteSafeResidual && nitrateSafeResidual) ? 'green' : (res.residualNitrite <= 100 ? 'yellow' : 'red');
  return `
    <div class="residual-panel">
      <div class="rp-hd">
        <span class="k">Degradacion durante el proceso</span>
        <span class="tiny">Modelo cinetico Nordin @ ${res.tempC} C, pH ${res.ph} · ${totalDays} dias totales</span>
      </div>
      <div class="rp-grid">
        <div class="rp-cell">
          <div class="tiny">Nitrito ingoing</div>
          <div class="rp-v" style="color:var(--muted)">${fmt(ingoingNitrite,0)} <span class="u">ppm</span></div>
        </div>
        <div class="rp-arrow">&rarr;</div>
        <div class="rp-cell rp-final ${level}">
          <div class="tiny">Nitrito residual estimado</div>
          <div class="rp-v">${fmt(res.residualNitrite,1)} <span class="u">ppm</span></div>
          <div class="tiny">-${fmt(res.reductionNitrite,0)}% (t½ ${fmt(res.halfLifeNitrite,0)} d)</div>
        </div>
        ${ingoingNitrate>0 ? `
          <div class="rp-cell">
            <div class="tiny">Nitrato ingoing</div>
            <div class="rp-v" style="color:var(--muted)">${fmt(ingoingNitrate,0)} <span class="u">ppm</span></div>
          </div>
          <div class="rp-arrow">&rarr;</div>
          <div class="rp-cell rp-final ${nitrateSafeResidual?'green':'yellow'}">
            <div class="tiny">Nitrato residual estimado</div>
            <div class="rp-v">${fmt(res.residualNitrate,1)} <span class="u">ppm</span></div>
            <div class="tiny">-${fmt(res.reductionNitrate,0)}% (t½ ${fmt(res.halfLifeNitrate,0)} d) · reduce a NO2 lento</div>
          </div>
        ` : ''}
      </div>
      ${renderDecayChart(ingoingNitrite, ingoingNitrate, totalDays, res.tempC, res.ph)}
      <div class="tiny rp-note">
        ${isLong ? `<b>Proceso largo (${totalDays} d):</b> el nitrito residual se degrada exponencialmente por conversion a oxido nitrico (que fija el color y sabor curado), y una fraccion se re-oxida a <b>nitrato</b>, la forma estable y segura para consumo presente en jamones anejados. Comparacion: productos comerciales US promedian ${RESIDUAL_TYPICAL_NITRITE_PPM} ppm nitrito y ${RESIDUAL_TYPICAL_NITRATE_PPM} ppm nitrato residuales &mdash; el nitrato acumulado no representa riesgo a estos niveles y es caracteristico de curados largos.` : `<b>Proceso corto (${totalDays} d):</b> gran parte del nitrito ingoing sigue presente al final. Considera consumo/coccion pronta.`}
      </div>
    </div>
  `;
}
/* Small SVG chart showing nitrite (and nitrate if present) decay over time */
function renderDecayChart(ingoingNit, ingoingNat, totalDays, tempC, ph){
  const w = 560, h = 130, pad = { l:44, r:12, t:12, b:22 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const xMax = Math.max(totalDays, 30);
  const yMax = Math.max(ingoingNit||0, ingoingNat||0, 50) * 1.05;
  const yMin = 0;
  const x = d => pad.l + iw * (d/xMax);
  const y = v => pad.t + ih * (1 - (v-yMin)/(yMax-yMin));
  const N = 60;
  const points = [];
  for(let i=0; i<=N; i++){
    const d = xMax * i/N;
    const nit = calcResidualNitrite(ingoingNit||0, d, tempC, ph) + nitriteFromNitrateReduction(ingoingNat||0, d, tempC, ph);
    const nat = calcResidualNitrate(ingoingNat||0, d, tempC, ph);
    points.push({d, nit, nat});
  }
  const pathNit = 'M '+points.map(p=>`${x(p.d).toFixed(1)},${y(p.nit).toFixed(1)}`).join(' L ');
  const pathNat = ingoingNat>0 ? 'M '+points.map(p=>`${x(p.d).toFixed(1)},${y(p.nat).toFixed(1)}`).join(' L ') : '';
  const gridY = [0, yMax*0.25, yMax*0.5, yMax*0.75, yMax];
  const totalX = x(totalDays);
  return `<svg class="decay-chart" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;margin-top:8px">
    ${gridY.map(v=>`<line x1="${pad.l}" y1="${y(v)}" x2="${w-pad.r}" y2="${y(v)}" stroke="var(--line)" stroke-width="0.5"/><text x="${pad.l-4}" y="${y(v)+3}" fill="var(--muted)" font-size="8.5" text-anchor="end" font-family="JetBrains Mono">${v.toFixed(0)}</text>`).join('')}
    <line x1="${totalX}" y1="${pad.t}" x2="${totalX}" y2="${h-pad.b}" stroke="var(--brand)" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6"/>
    <text x="${totalX}" y="${h-pad.b+13}" fill="var(--brand)" font-size="9" text-anchor="middle" font-family="JetBrains Mono">${totalDays} d</text>
    <text x="${pad.l}" y="${h-pad.b+13}" fill="var(--muted)" font-size="9" text-anchor="start" font-family="JetBrains Mono">0</text>
    <text x="${w-pad.r}" y="${h-pad.b+13}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="JetBrains Mono">${xMax.toFixed(0)} d</text>
    <path d="${pathNit}" fill="none" stroke="#e08662" stroke-width="1.6"/>
    ${pathNat?`<path d="${pathNat}" fill="none" stroke="var(--sage)" stroke-width="1.6" stroke-dasharray="4,2"/>`:''}
    <text x="${w-pad.r-6}" y="${pad.t+11}" fill="#e08662" font-size="9" text-anchor="end" font-family="JetBrains Mono">NO2-</text>
    ${ingoingNat>0?`<text x="${w-pad.r-6}" y="${pad.t+22}" fill="var(--sage)" font-size="9" text-anchor="end" font-family="JetBrains Mono">NO3-</text>`:''}
  </svg>`;
}
function renderCureSafetyAlert(r){
  if(r.cureLevel==='gray') return '';
  if(r.cureLevel==='red'){

    if(r.nitritePpm > NITRITE_MAX_PPM) reasons.push(`Nitrito ${fmt(r.nitritePpm,0)} ppm supera el limite USDA (${NITRITE_MAX_PPM} ppm)`);
    if(r.nitratePpm > NITRATE_MAX_PPM) reasons.push(`Nitrato ${fmt(r.nitratePpm,0)} ppm supera el limite USDA (${NITRATE_MAX_PPM} ppm)`);

    return `<div class="hazard"><span class="skull">&#9760;</span><div class="msg"><b>Peligro sanitario:</b> ${reasons.join(' - ')}. Reducir la dosis de sal de cura antes de aplicar.</div></div>`;

  return `<div class="cure-ok"><span>&#10003;</span><div>Nivel de nitrito seguro: ${fmt(r.nitritePpm,0)} ppm (objetivo <=${NITRITE_TARGET_PPM} ppm, max ${NITRITE_MAX_PPM}).</div></div>`;
}

  if(v<ph.dangerLow || v>ph.dangerHigh) return 'alert';   // out of safe range → orange skull
  if(v<ph.start-0.3 || v>ph.start+0.3) return 'yellow';   // outside expected window → yellow
  return 'green';                                          // within window → green
}

function renderWeightChart(b){
  // Chart shows % of initial weight (so pieces of very different sizes overlap).
  const finalEnd = b.stages[b.stages.length-1]?.expectedEnd;
  const w = 560, h = 220, pad = { l:44, r:14, t:16, b:28 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;

  const t0 = new Date(b.startedAt).getTime();
  const tEnd = new Date(finalEnd || Date.now()).getTime();

  // y-axis: % of initial (100% → target%)
  const targetPct = b.targetYield;
  const yMin = Math.min(targetPct - 5, 40);
  const yMax = 102;

  const x = (d)=> pad.l + iw * (new Date(d).getTime()-t0)/(tEnd-t0 || 1);
  const y = (pct)=> pad.t + ih * (1 - (pct-yMin)/(yMax-yMin));

  // color palette for pieces
  const palette = ['#c98a3e','#7a8b6f','#8b6f4e','#a75e3a','#5f7c6b','#b09468','#6b5a4a','#98735c','#4d6b8a','#8a4d6b'];

  // grid lines
  const gridVals = [];
  const step = (yMax - yMin)/5;
  for(let i=0;i<=5;i++) gridVals.push(yMin + step*i);

  const nowX = x(new Date());

  // v2.1 #07 — Theoretical drying curve (dashed) from physics (T, HR from envLog)
  const envForTheory = envStats(b, 'Secado') || envStats(b, 'Madurado') || envStats(b);
  const sec = findSecadoStage(b);
  const theoreticalLines = (envForTheory && sec && sec.startedAt) ? b.pieces.map((p, idx)=>{
    const color = palette[idx % palette.length];
    const startW = pieceStartWeight(b, p);
    const target = pieceTargetWeight(b, p);
    if(!startW || !target || target >= startW) return '';
    const kTheo = dryingRateK({
      tempC: envForTheory.avgT ?? 13,
      hrPct: envForTheory.avgHR ?? 75,
      thicknessCm: p.thickness,
      shape: p.shape
    });
    if(kTheo <= 0) return '';
    // Project theoretical curve from Secado start, 40 points to end of chart
    const secStart = new Date(sec.startedAt).getTime();
    const steps = 40;
    const pts = [];
    for(let i=0; i<=steps; i++){
      const t = (tEnd - secStart) * (i/steps) / (1000*60*60*24); // days from secStart
      if(t < 0) continue;
      const w = theoreticalWeightAt({ W0: startW, Wtarget: target, k: kTheo, t });
      const pct = 100 * w / p.initialWeight;
      const xx = x(secStart + t * 1000*60*60*24);
      const yy = y(pct);
      if(xx >= pad.l && xx <= w - pad.r && yy >= pad.t && yy <= h - pad.b){
        pts.push({x: xx, y: yy});
      }
    }
    if(pts.length < 2) return '';
    const path = 'M '+pts.map(pt=>`${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join(' L ');
    return `<path d="${path}" fill="none" stroke="${color}" stroke-width="0.9" stroke-dasharray="3,3" opacity="0.45"/>`;
  }).join('') : '';

  // per-piece polylines (real data)
  const pieceLines = b.pieces.map((p, idx)=>{
    const color = palette[idx % palette.length];
    const logs = (p.weightLogs||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
    const points = [{date:b.startedAt, weight:p.initialWeight}].concat(logs.map(l=>({date:l.date, weight:l.weight, outlier:l.outlier})));
    const pts = points.map(pt=>({
      x: x(pt.date),
      y: y(100*pt.weight/p.initialWeight),
      outlier: pt.outlier
    }));
    // Build path only through non-outlier points
    const nonOutlier = pts.filter(pt => !pt.outlier);
    const path = nonOutlier.length>1 ? 'M '+nonOutlier.map(pt=>`${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join(' L ') : '';
    const dots = pts.map(pt=>`<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="2.5" fill="${pt.outlier?'none':color}" stroke="${color}" stroke-width="${pt.outlier?'1':'0'}" ${pt.outlier?'stroke-dasharray="1,1"':''}/>`).join('');
    return `<g><title>${p.code||('P'+(idx+1))}</title>${path?`<path d="${path}" fill="none" stroke="${color}" stroke-width="1.6" opacity="0.9"/>`:''}${dots}</g>`;
  }).join('');

  // legend
  const legend = b.pieces.map((p,idx)=>{
    const color = palette[idx % palette.length];
    const st = weightStatusForPiece(b,p);
    return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:10.5px">
      <span style="width:10px;height:2px;background:${color};display:inline-block"></span>
      <span class="mono" style="color:${color}">${p.code||('P'+(idx+1))}</span>
      <span class="tiny">${st.hasLog?fmt(st.pct,0)+'%':'—'}</span>
    </span>`;
  }).join('');

  return `<div>
    <svg class="spark" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
      ${gridVals.map(v=> `<line x1="${pad.l}" y1="${y(v)}" x2="${w-pad.r}" y2="${y(v)}" stroke="var(--line)" stroke-width="0.5"/><text x="${pad.l-6}" y="${y(v)+3}" fill="var(--muted)" font-size="9" text-anchor="end" font-family="JetBrains Mono">${v.toFixed(0)}%</text>`).join('')}
      <line x1="${pad.l}" y1="${y(targetPct)}" x2="${w-pad.r}" y2="${y(targetPct)}" stroke="var(--sage)" stroke-dasharray="4,3" stroke-width="1"/>
      <text x="${w-pad.r-4}" y="${y(targetPct)-4}" fill="var(--sage)" font-size="10" text-anchor="end" font-family="JetBrains Mono">objetivo ${targetPct}%</text>
      <line x1="${pad.l}" y1="${y(100)}" x2="${w-pad.r}" y2="${y(100)}" stroke="var(--muted)" stroke-dasharray="2,2" stroke-width="0.6" opacity="0.5"/>
      ${theoreticalLines}
      ${pieceLines}
      ${nowX>=pad.l && nowX<=w-pad.r ? `<line x1="${nowX}" y1="${pad.t}" x2="${nowX}" y2="${h-pad.b}" stroke="var(--brand)" stroke-width="0.8" opacity="0.6"/>` : ''}
    </svg>
    <div style="margin-top:6px;line-height:1.9">${legend}</div>
    ${envForTheory ? `<div class="tiny" style="color:var(--muted);margin-top:4px;font-style:italic">Línea punteada: curva teórica con T=${envForTheory.avgT?.toFixed(1)}°C, HR=${envForTheory.avgHR?.toFixed(0)}% (promedio Govee). Compara real vs físico.</div>` : '<div class="tiny" style="color:var(--muted);margin-top:4px;font-style:italic">Registra T/HR en 🌡 para ver la curva teórica superpuesta.</div>'}
  </div>`;
}

/* Render a single piece card with its own log & mini history */
function renderPieceCard(b, p, idx){
  const st = weightStatusForPiece(b, p);
  const logs = (p.weightLogs||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const latest = latestPieceWeight(p);
  const startW = pieceStartWeight(b, p);
  const startExplicit = pieceStartWeightExplicit(b, p);
  const baseW = startW || p.initialWeight;
  const lossPct = baseW>0 ? 100*(1 - latest/baseW) : 0;
  const batchLoss = batchLossTargetPct(b);
  const est = pieceEstimation(b, p);
  const sec = findSecadoStage(b);
  // v2.0 — aw and safety status
  const safety = safetyStatus(b, p);
  const awBadgeColor = safety.level==='green'?'sage':safety.level==='red'?'rust':safety.level==='yellow'?'gold':'muted';
  // v2.0 — aw-derived target weight (parallel to %-based target)
  const type = db.types.find(t=>t.id===b.typeId);
  const awTarget = awTargetForType(type);
  const awBasedTargetG = targetWeightForAw({ greenG: p.initialWeight, awTarget, saltPct: safety.saltPct });
  return `
    <div class="piece-card">
      <div class="pc-head">
        <div>
          <span class="pc-code mono">${p.code||('P'+(idx+1))}</span>
          <span class="tiny" style="margin-left:8px">${p.shape||'—'}${p.thickness?' · '+p.thickness+' cm':''}</span>
          ${safety.aw!==null ? `<span class="pill ${awBadgeColor}" style="margin-left:8px;font-family:'JetBrains Mono',monospace">aw ${safety.aw.toFixed(3)}</span>` : ''}
        </div>
        <span class="spacer"></span>
        <span class="al ${st.level}"><span class="dot-al"></span>${st.label}</span>
      </div>
      <div class="safety-banner safety-${safety.level}" style="padding:6px 10px;margin:6px 0;border-radius:4px;font-size:12px;font-weight:600;letter-spacing:0.03em;text-align:center;background:${safety.level==='green'?'rgba(122,139,111,0.15)':safety.level==='red'?'rgba(167,94,58,0.15)':safety.level==='yellow'?'rgba(176,148,104,0.15)':'rgba(138,131,120,0.1)'};color:${safety.level==='green'?'var(--sage)':safety.level==='red'?'var(--rust)':safety.level==='yellow'?'var(--amber)':'var(--muted)'};border:1px solid ${safety.level==='green'?'var(--sage)':safety.level==='red'?'var(--rust)':safety.level==='yellow'?'var(--amber)':'var(--line)'}">
        ${safety.level==='green'?'✓ ':safety.level==='red'?'⚠ ':''}${safety.label}
        ${safety.aw!==null?`<span style="opacity:0.7;font-weight:400;font-size:11px;margin-left:8px">· objetivo aw ≤ ${safety.awTarget.toFixed(2)}</span>`:''}
      </div>
      ${st.needsStart ? `<div class="pc-needs-start"><span>⚠</span> <b>Sin registros de peso.</b> Registra el peso al iniciar Secado para calcular el objetivo. <button class="btn xs primary" style="margin-left:auto" onclick="openSecadoStartModal('${b.id}')">Registrar inicio</button></div>` : ''}
      ${startW && !startExplicit ? `<div class="pc-infer-note"><span>ℹ</span> Peso inicial inferido del primer registro (${fmtG(startW)}). <a onclick="openSecadoStartModal('${b.id}')" style="color:var(--brand);cursor:pointer">Ajustar &rarr;</a></div>` : ''}
      <div class="pc-stats">
        <div><div class="tiny">Verde</div><div class="mono">${fmtGExact(p.initialWeight)}</div></div>
        ${startW?`<div><div class="tiny">Inicio Secado</div><div class="mono" style="color:var(--sage)">${fmtGExact(startW)}</div></div>`:'<div><div class="tiny">Inicio Secado</div><div class="mono" style="color:var(--muted)">—</div></div>'}
        <div><div class="tiny">Actual</div><div class="mono">${st.hasLog?fmtGExact(latest):'—'}</div></div>
        <div><div class="tiny">Objetivo %</div><div class="mono" style="color:var(--brand)">${fmtGExact(st.target)}</div></div>
        ${awBasedTargetG ? `<div><div class="tiny">Objetivo aw ≤${awTarget.toFixed(2)}</div><div class="mono" style="color:var(--amber)">${fmtGExact(awBasedTargetG)}</div></div>` : ''}
        <div><div class="tiny">Pérdida</div><div class="mono ${st.hasLog?(st.level==='green'?'ph-safe':'ph-warn'):''}">${(st.hasLog && baseW>0)?fmt(lossPct,1)+'%':'—'}</div></div>
      </div>
      ${startW && st.hasLog ? `<div class="pc-formula tiny">Formula: <b>${fmtGExact(startW)}</b> × (1 - <b>${batchLoss}%</b>/100) = <b style="color:var(--brand)">${fmtGExact(st.target)}</b> &middot; falta <b>${fmtGExact(Math.max(0, latest - st.target))}</b> para alcanzar el objetivo (${fmt(st.pct,0)}% completo)</div>` : ''}
      ${est && est.hasEnough ? `
        <div class="pc-estimation">
          <span class="tiny">Estimacion exponencial</span>
          <div class="pc-est-grid">
            <div><div class="tiny">Progreso</div><div class="mono" style="color:var(--brand)">${fmt(est.pctComplete,0)}%</div></div>
            <div><div class="tiny">Dias restantes</div><div class="mono">${est.daysRemaining<1?'<1':fmt(est.daysRemaining,1)}</div></div>
            <div><div class="tiny">Fin estimado</div><div class="mono" style="color:var(--sage)">${fmtDate(est.estCompletion)}</div></div>
          </div>
        </div>
      ` : (est && est.note ? `<div class="pc-est-note tiny">${est.note}</div>` : '')}
      ${p.notes?`<div class="tiny" style="margin-top:4px;color:var(--muted)">${escapeHtml(p.notes)}</div>`:''}
      <div class="pc-actions">
        <button class="btn xs" onclick="openPieceWeightModal('${b.id}','${p.id}')">＋ Registrar peso</button>
        <span class="spacer"></span>
        <span class="tiny">${logs.length} registro${logs.length===1?'':'s'}</span>
      </div>
      ${logs.length>0 ? `
        <div class="piece-log">
          ${logs.slice(0,5).map(l=>{
            const pctL = 100*(1 - l.weight/p.initialWeight);
            const isOutlier = l.outlier;
            const isSus = l.suspicious && !isOutlier;
            return `<div class="wl${isOutlier?' outlier':''}" style="${isOutlier?'opacity:0.5;text-decoration:line-through':''}">
              <span class="d" title="${fmtDate(l.date)}">${fmtDateShort(l.date)}${isSus?` <span title="${l.suspicious==='fast-loss'?'Pérdida muy rápida':'Ganancia inusual'}" style="color:var(--amber)">⚠</span>`:''}</span>
              <span class="tiny" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.note||''}</span>
              <span class="w">${fmtGExact(l.weight)}</span>
              <span class="p">${fmt(pctL,1)}%</span>
              <span class="rm" onclick="toggleOutlier('${b.id}','${p.id}','${l.id}')" title="${isOutlier?'Reincluir en fit':'Marcar como outlier'}" style="color:${isOutlier?'var(--sage)':'var(--amber)'};cursor:pointer;text-align:center">${isOutlier?'↺':'⊘'}</span>
              <span class="rm" onclick="removePieceWeightLog('${b.id}','${p.id}','${l.id}')" title="Eliminar" style="text-align:center">✕</span>
            </div>`;
          }).join('')}
          ${logs.length>5?`<div class="tiny" style="text-align:center;padding:4px;color:var(--muted)">y ${logs.length-5} más antiguos…</div>`:''}
        </div>` : ''}
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════
    VIEW: TYPE EDITOR (with drag-drop flow)
   ═══════════════════════════════════════════════════════════ */
function viewTypeEditor(){
  const t = editingType;
  if(!t) return '<div class="empty">Selecciona un tipo primero.</div>';
  return `
    <div class="page-head">
      <div>
        <div class="eyebrow"><a onclick="goto('types')" style="cursor:pointer;color:var(--muted)">← Tipos</a> · <span class="mono">${t.ref}</span></div>
        <h1>${t.name}</h1>
      </div>
      <div class="actions">
        <button class="btn sm danger" onclick="deleteType('${t.id}')">Eliminar tipo</button>
        <button class="btn sm ghost" onclick="duplicateType('${t.id}')">Duplicar</button>
      </div>
    </div>

    <div class="grid grid-3" style="align-items:start">
      <div class="card" style="grid-column:span 2">
        <h3>Información General</h3>
        <div class="grid grid-2" style="margin-top:12px">
          <div><label>Nombre</label><input value="${escapeAttr(t.name)}" oninput="updateType('${t.id}','name',this.value)"></div>
          <div><label>Referencia (6 chars)</label><input value="${t.ref}" maxlength="6" style="text-transform:uppercase" oninput="updateType('${t.id}','ref',this.value.toUpperCase())"></div>
          <div><label>Categoría</label>
            <select onchange="updateType('${t.id}','category',this.value)">
              <option value="entera" ${t.category==='entera'?'selected':''}>Pieza entera (whole muscle)</option>
              <option value="embutido" ${t.category==='embutido'?'selected':''}>Embutido / molida</option>
            </select>
          </div>
          <div><label>Notas</label><input value="${escapeAttr(t.notes||'')}" oninput="updateType('${t.id}','notes',this.value)"></div>
        </div>
        <hr>
        <h4>Yield objetivo (peso final / peso verde)</h4>
        <div class="grid grid-3" style="margin-top:8px">
          <div><label>Target %</label><input type="number" min="30" max="100" step="1" value="${t.yield.target}" oninput="updateYield('${t.id}','target',+this.value)"></div>
          <div><label>Mínimo (más húmedo)</label><input type="number" min="30" max="100" step="1" value="${t.yield.min}" oninput="updateYield('${t.id}','min',+this.value)"></div>
          <div><label>Máximo (más seco)</label><input type="number" min="30" max="100" step="1" value="${t.yield.max}" oninput="updateYield('${t.id}','max',+this.value)"></div>
        </div>
        <div class="tiny" style="margin-top:6px">Rango recomendado al crear un lote. Cada lote luego lo ajusta según el gusto del cliente.</div>
      </div>

      <div class="card">
        <h3>Estimación Total</h3>
        <div class="tiny" style="margin-top:4px">Duración total del ciclo</div>
        ${[3,5,7,9,12].map(cm=>{
          const days = typeTotalDays(t, cm);
          return `<div class="row" style="padding:5px 0;border-bottom:1px dotted var(--line);font-size:12.5px">
            <span class="mono" style="width:60px">${cm} cm</span>
            <span class="spacer"></span>
            <span class="mono" style="color:var(--brand);font-weight:600">${Math.round(days)} d</span>
            <span class="tiny" style="width:60px;text-align:right">≈ ${(days/30).toFixed(1)} m</span>
          </div>`;
        }).join('')}
        <div class="tiny" style="margin-top:8px">Basado en el grosor típico de una pieza tubular. Ajustable por lote.</div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="row"><h3>Flujo de Proceso</h3><span class="spacer"></span><span class="tiny">Arrastrá las etapas para reordenar</span></div>
      <div id="flow" class="flow">
        ${t.stages.map((s,i)=> renderFlowStage(t,s,i)).join(''+(t.stages.length>0?'<div class="flow-arrow">→</div>':''))}

        <div class="flow-add" onclick="openAddStageModal('${t.id}')"><span>Agregar etapa</span></div>

}

function renderFlowStage(t, s, i){
  const meta = STAGE_MAP[s.kind];
  return `<div class="flow-stage" draggable="true" data-idx="${i}"
    ondragstart="dragStart(event,${i})" ondragend="dragEnd(event)"
    ondragover="dragOver(event)" ondrop="dropStage(event,${i})">
    <div class="st-head">
      <span class="sd ${s.kind}"></span>
      <span class="st-name">${s.kind}</span>
      <span class="spacer"></span>
      <span class="st-days">${s.dEst}d</span>
    </div>
    <div class="st-note">${meta.note}</div>
    ${s.recipe && s.recipe.length? `<div class="st-recipe">◐ ${s.recipe.length} ingredientes</div>`:''}
    ${s.inoc? `<div class="st-recipe" style="color:var(--paprika)">✱ ${s.inoc.i}</div>`:''}
  </div>${i < t.stages.length-1 ? '<div class="flow-arrow">→</div>' : ''}`;
}

function renderStageEditor(t, s, i){
  const meta = STAGE_MAP[s.kind];
  return `
    <div class="stage-card">
      <div class="sh">
        <span class="sd ${s.kind}"></span>
        <span class="idx">E${i+1}</span>
        <span class="n">${s.kind}</span>
        <span class="spacer"></span>
        <button class="btn sm ghost" onclick="moveStage('${t.id}',${i},-1)" ${i===0?'disabled':''}>↑</button>
        <button class="btn sm ghost" onclick="moveStage('${t.id}',${i},1)" ${i===t.stages.length-1?'disabled':''}>↓</button>
        <button class="btn sm danger" onclick="removeStage('${t.id}',${i})">Eliminar</button>
      </div>

      <div class="grid grid-4" style="gap:10px">
        <div><label>Duración est. (días)</label><input type="number" min="0" step="0.5" value="${s.dEst}" oninput="updateStageField('${t.id}',${i},'dEst',+this.value)"></div>
        ${s.kind==='Curado' ? `
          <div><label>Cálculo por Eq. Brine</label>
            <select onchange="updateStageField('${t.id}',${i},'eb',this.value==='true')">
              <option value="true" ${s.eb?'selected':''}>Sí (auto por grosor)</option>
              <option value="false" ${!s.eb?'selected':''}>No (usar duración fija)</option>
            </select>
          </div>
          <div><label>Forma pieza</label>
            <select onchange="updateStageField('${t.id}',${i},'shape',this.value)">
              <option value="tubular" ${s.shape==='tubular'?'selected':''}>Tubular</option>
              <option value="flat" ${s.shape==='flat'?'selected':''}>Plana</option>
            </select>
          </div>
        `:''}
        ${meta.press? `
          <div><label>Prensado</label>
            <select onchange="updateStageField('${t.id}',${i},'press',this.value==='true')">
              <option value="false" ${!s.press?'selected':''}>No</option>
              <option value="true" ${s.press?'selected':''}>Sí</option>
            </select>
          </div>
        `:''}
      </div>

      ${s.kind==='Curado' ? renderBrineEditor(t, s, i) : ''}
      ${s.kind==='Ahumado' ? renderSmokeEditor(t, s, i) : ''}

      ${meta.env? `
        <div class="divider-lbl">Ambiente</div>
        <div class="grid grid-4" style="gap:10px">
          <div><label>T min °C</label><input type="number" step="0.5" value="${s.env?.tMin??''}" oninput="updateEnv('${t.id}',${i},'tMin',+this.value)"></div>
          <div><label>T max °C</label><input type="number" step="0.5" value="${s.env?.tMax??''}" oninput="updateEnv('${t.id}',${i},'tMax',+this.value)"></div>
          <div><label>HR min %</label><input type="number" step="1" value="${s.env?.hMin??''}" oninput="updateEnv('${t.id}',${i},'hMin',+this.value)"></div>
          <div><label>HR max %</label><input type="number" step="1" value="${s.env?.hMax??''}" oninput="updateEnv('${t.id}',${i},'hMax',+this.value)"></div>
        </div>
      `:''}

      ${meta.ph? `
        <div class="divider-lbl">Control pH</div>
        <div class="grid grid-4" style="gap:10px">
          <div><label>pH esperado inicio</label><input type="number" step="0.1" value="${s.ph?.start??''}" oninput="updatePh('${t.id}',${i},'start',+this.value)"></div>
          <div><label>pH esperado fin</label><input type="number" step="0.1" value="${s.ph?.end??''}" oninput="updatePh('${t.id}',${i},'end',+this.value)"></div>
          <div><label>pH peligro bajo</label><input type="number" step="0.1" value="${s.ph?.dangerLow??''}" oninput="updatePh('${t.id}',${i},'dangerLow',+this.value)"></div>
          <div><label>pH peligro alto</label><input type="number" step="0.1" value="${s.ph?.dangerHigh??''}" oninput="updatePh('${t.id}',${i},'dangerHigh',+this.value)"></div>
        </div>
      `:''}

      ${meta.recipe!=='none' ? renderRecipeEditor(t, s, i) : ''}

      <div class="divider-lbl">Inoculante (cultivo/hongo)</div>
      ${s.inoc? (()=>{
        const cultureIng = db.ingredients.find(x=>x.name===s.inoc.i);
        const hasSpec = cultureIng && (+cultureIng.starterTsp > 0);
        return `
        <div class="grid grid-2" style="gap:10px;margin-bottom:8px">
          <div><label>Cultivo</label>
            <select onchange="updateInoc('${t.id}',${i},'i',this.value)">
              <option value="">&mdash; ninguno &mdash;</option>
              ${db.ingredients.filter(x=>x.category==='cultivo').map(x=>`<option ${s.inoc.i===x.name?'selected':''}>${x.name}</option>`).join('')}
            </select>
            ${hasSpec ? `<div class="tiny">Base: ${fmtFrac(cultureIng.starterTsp)} cucharadita starter + ${fmt((+cultureIng.waterMlPer5lb)||((+cultureIng.waterCupsPer5lb||0)*236.588),0)} ml agua por 2,27 kg (5 lb) - rehidratar ${cultureIng.rehydMin||30} min</div>` : `<div class="tiny" style="color:var(--amber)">Este cultivo no tiene proporciones de rehidratacion. <a onclick="goto('ingredients')" style="color:var(--brand);cursor:pointer">Editar &rarr;</a></div>`}
          </div>
          <div><label>Preview sobre 1 kg de carne</label>
            <div class="inoc-preview-mini">
              ${cultureIng ? (()=>{
                const s1kg = scaleInoculant(cultureIng, 1);
                return s1kg ? `<span class="chip-num">${fmtFrac(s1kg.starterTsp,3)} tsp starter</span> <span class="chip-num">${fmt(s1kg.waterMl,1)} ml agua</span>` : '<span class="tiny">Sin datos</span>';
              })() : '<span class="tiny">Sin cultivo seleccionado</span>'}
            </div>
          </div>
        </div>
      `; })() : `<button class="btn sm ghost" onclick="addInoc('${t.id}',${i})">&#43; Agregar inoculante</button>`}
      ${s.inoc? `<div class="row" style="margin-top:8px"><button class="btn sm danger" onclick="removeInoc('${t.id}',${i})">Quitar inoculante</button></div>`:''}
    </div>
  `;
}


function renderSmokeEditor(t, s, i){
  if(!s.smoke) s.smoke = { hours:6, tempC:22, woods:['Nogal'] };
  const smoke = s.smoke;
  const cat = smokeCategoryFor(smoke.tempC || 0);
  const range = SMOKE_RANGES[cat];
  const woods = smoke.woods || [];
  return `
    <div class="divider-lbl">Ahumado - Configuracion</div>
    <div class="smoke-editor">

      <!-- Tiempo -->
      <div class="stepper-block">
        <label class="bv-lbl">Tiempo de Ahumado</label>
        <div class="stepper">
          <button class="stp-btn" onclick="stepSmoke('${t.id}',${i},'hours',-1)">&minus;</button>
          <div class="stp-bar">
            <div class="stp-fill" style="width:${Math.min(100, (smoke.hours/48)*100)}%"></div>
            <div class="stp-val"><b>${smoke.hours||0}</b> horas</div>
          </div>
          <button class="stp-btn" onclick="stepSmoke('${t.id}',${i},'hours',1)">+</button>
        </div>
        <div class="tiny">Ajuste en incrementos de 1 hora &middot; rango tipico 2-24 h</div>
      </div>

      <!-- Temperatura -->
      <div class="stepper-block">
        <label class="bv-lbl">Temperatura de Ahumado</label>
        <div class="stepper">
          <button class="stp-btn" onclick="stepSmoke('${t.id}',${i},'tempC',-2)">&minus;</button>
          <div class="stp-bar stp-bar-temp">
            <div class="stp-fill stp-fill-${cat}" style="width:${Math.min(100, (smoke.tempC/120)*100)}%"></div>
            <div class="stp-val"><b>${smoke.tempC||0}</b> &deg;C</div>
            <div class="stp-zones">
              <span class="zone-cold" title="Ahumado en frio 15-30 C"></span>
              <span class="zone-warm" title="Ahumado tibio 30-60 C"></span>
              <span class="zone-hot" title="Ahumado caliente 60-120 C"></span>
            </div>
          </div>
          <button class="stp-btn" onclick="stepSmoke('${t.id}',${i},'tempC',2)">+</button>
        </div>
        <div class="smoke-legend">
          <span class="lg-item ${cat==='cold'?'active':''}"><span class="lg-dot cold"></span> Frio 15-30 &deg;C</span>
          <span class="lg-item ${cat==='warm'?'active':''}"><span class="lg-dot warm"></span> Tibio 30-60 &deg;C</span>
          <span class="lg-item ${cat==='hot'?'active':''}"><span class="lg-dot hot"></span> Caliente 60-120 &deg;C</span>
        </div>
        <div class="tiny smoke-range-note"><b>${range.label}:</b> ${range.note}</div>
      </div>

      <!-- Maderas -->
      <div class="stepper-block">
        <label class="bv-lbl">Maderas para Ahumar (selecciona una o mas)</label>
        <div class="wood-grid">
          ${SMOKE_WOODS.map(w => {
            const isSelected = woods.includes(w.es);
            return `<label class="wood-opt ${isSelected?'selected':''}" onclick="event.preventDefault(); toggleWood('${t.id}',${i},'${w.es}')">
              <div class="wood-hd">
                <input type="checkbox" ${isSelected?'checked':''} readonly>
                <div>
                  <div class="wood-name"><b>${w.es}</b> <span class="tiny">(${w.en})</span></div>
                  <div class="wood-int wood-int-${w.intensity.split(' ')[0]}">${w.intensity}</div>
                </div>

function stepSmoke(typeId, idx, field, delta){
  const t = db.types.find(x=>x.id===typeId);
  const s = t.stages[idx];
  if(!s.smoke) s.smoke = { hours:6, tempC:22, woods:['Nogal'] };
  const bounds = { hours:[0,72], tempC:[10,150] };
  const [min,max] = bounds[field] || [0, 999];
  const cur = +s.smoke[field] || 0;
  const next = Math.max(min, Math.min(max, cur + delta));
  s.smoke[field] = next;
  saveDB(); render();
}
function toggleWood(typeId, idx, woodName){
  const t = db.types.find(x=>x.id===typeId);
  const s = t.stages[idx];
  if(!s.smoke) s.smoke = { hours:6, tempC:22, woods:[] };
  if(!s.smoke.woods) s.smoke.woods = [];
  const i = s.smoke.woods.indexOf(woodName);
  if(i>=0) s.smoke.woods.splice(i,1);
  else s.smoke.woods.push(woodName);
  saveDB(); render();
}

/* Type-editor residual preview: uses total dEst of ALL stages, warns if short-cure with too much nitrite */
function renderTypeResidualPreview(t, demo){
  const totalDays = totalCureProcessDays(t);
  if(!totalDays) return '';
  const res = calcCureResidual({cureIng:demo.cureIng, nitritePpm:demo.nitritePpm, nitratePpm:demo.nitratePpm}, totalDays, DEFAULT_CAVA_TEMP, DEFAULT_CAVA_PH);
  if(!res) return '';
  const isLong = totalDays >= 30;
  const usingNitrateSaltForShort = demo.nitratePpm > 0 && totalDays < 30;
  const usingNitriteOnlyForLong = demo.nitratePpm === 0 && totalDays > 60;
  return `
    <div class="residual-preview">
      <div class="rp-hd">
        <span class="k">Estimacion al Finalizar el Proceso Completo</span>
        <span class="tiny">${totalDays} dias totales (suma de todas las etapas) @ ${res.tempC} C, pH ${res.ph}</span>
      </div>
      <div class="bv-res-legend">
        <span class="tiny"><b>NO<sub>2</sub><sup>-</sup></b> = nitrito (agente activo antimicrobiano, se degrada con el tiempo)</span>
        <span class="tiny"><b>NO<sub>3</sub><sup>-</sup></b> = nitrato (forma estable, reservorio de nitrito en curas largas)</span>
      </div>
      <div class="rp-mini">
        <div class="chip-res-v2">
          <div class="cr-label"><b>Nitrito</b> (NO<sub>2</sub><sup>-</sup>)</div>
          <div class="cr-flow"><span class="cr-in">${fmt(demo.nitritePpm,0)} ppm inicial</span> &rarr; <span class="cr-out">${fmt(res.residualNitrite,1)} ppm residual</span></div>
          <div class="tiny cr-drop">Reduccion: -${fmt(res.reductionNitrite,0)}%</div>
        </div>
        ${demo.nitratePpm>0 ? `
        <div class="chip-res-v2">
          <div class="cr-label"><b>Nitrato</b> (NO<sub>3</sub><sup>-</sup>)</div>
          <div class="cr-flow"><span class="cr-in">${fmt(demo.nitratePpm,0)} ppm inicial</span> &rarr; <span class="cr-out">${fmt(res.residualNitrate,1)} ppm residual</span></div>
          <div class="tiny cr-drop">Reduccion: -${fmt(res.reductionNitrate,0)}%</div>
        </div>` : ''}
      </div>
      ${usingNitrateSaltForShort ? `<div class="cure-warn" style="margin-top:8px"><span>&#9888;</span><div>Usando InstaCure #2 (con nitrato) en un proceso corto (${totalDays} d). El nitrato apenas se convierte y queda residual alto. Considera InstaCure #1 para procesos <30 d.</div></div>` : ''}
      ${usingNitriteOnlyForLong ? `<div class="cure-warn" style="margin-top:8px"><span>&#9888;</span><div>Usando InstaCure #1 (solo nitrito) en un proceso largo (${totalDays} d). El nitrito se agota temprano y pierde efecto antimicrobiano. Considera InstaCure #2 (con nitrato reservorio) para procesos >60 d.</div></div>` : ''}
      ${isLong && !usingNitrateSaltForShort && !usingNitriteOnlyForLong ? `<div class="cure-ok" style="margin-top:8px"><span>&#10003;</span><div>Combinacion adecuada: sal de cura correcta para la duracion del proceso. Residuales dentro de rangos comerciales tipicos (${RESIDUAL_TYPICAL_NITRITE_PPM} ppm nitrito, ${RESIDUAL_TYPICAL_NITRATE_PPM} ppm nitrato en promedio US).</div></div>` : ''}
    </div>
  `;
}
function stepBrine(typeId, idx, field, delta){
  const t = db.types.find(x=>x.id===typeId);
  const st = t.stages[idx];
  if(!st.brine) st.brine = { saltPct:2.8, waterPct:0, saltIngredient: defaultCommonSaltName(), cureSalt:{ingredient:null, gPerKg:0} };
  const bounds = { saltPct:[0.5,6], waterPct:[0,50] };
  const [min,max] = bounds[field] || [0, 999];
  const cur = +st.brine[field] || 0;
  const next = Math.max(min, Math.min(max, +(cur + delta).toFixed(2)));
  st.brine[field] = next;
  saveDB(); render();
}
function stepCureSalt(typeId, idx, delta){
  const t = db.types.find(x=>x.id===typeId);
  const st = t.stages[idx];
  if(!st.brine) st.brine = { saltPct:2.8, waterPct:0, saltIngredient: defaultCommonSaltName(), cureSalt:{ingredient:null, gPerKg:0} };
  if(!st.brine.cureSalt) st.brine.cureSalt = { ingredient:null, gPerKg:0 };
  if(!st.brine.cureSalt.ingredient) return;
  const cureIng = cureSaltByName(st.brine.cureSalt.ingredient);
  const max = cureIng?.maxGPerKg || 4;
  const cur = +st.brine.cureSalt.gPerKg || 0;
  const next = Math.max(0, Math.min(max, +(cur + delta).toFixed(2)));
  st.brine.cureSalt.gPerKg = next;
  saveDB(); render();
}
function updateCureSalt(typeId, idx, field, value){
  const t = db.types.find(x=>x.id===typeId);
  const st = t.stages[idx];
  if(!st.brine) st.brine = {saltPct:2.8, waterPct:0, saltIngredient: defaultCommonSaltName(), cureSalt:{ingredient:null, gPerKg:0}};
  if(!st.brine.cureSalt) st.brine.cureSalt = {ingredient:null, gPerKg:0};
  if(field==='ingredient' && !value){
    st.brine.cureSalt.ingredient = null;
    st.brine.cureSalt.gPerKg = 0;
  } else {
    st.brine.cureSalt[field] = value;
    if(field==='ingredient' && (!st.brine.cureSalt.gPerKg || st.brine.cureSalt.gPerKg===0)){
      st.brine.cureSalt.gPerKg = 2.5;
    }
  }
  saveDB(); renderIfNoFocus();
}

function updateBrine(typeId, idx, field, value){
  const t = db.types.find(x=>x.id===typeId);
  if(!t.stages[idx].brine) t.stages[idx].brine = {saltPct:2.8, waterPct:0, saltIngredient: defaultSaltName(), cureSalt:{ingredient:null, gPerKg:0}};
  t.stages[idx].brine[field] = value;
  saveDB(); renderIfNoFocus();
}

                ${isSalt?`<td class="r mono ${i.gPerTsp?'':'muted'}">${i.gPerTsp? fmt(+i.gPerTsp,1) : '—'}</td>`:''}
                <td class="tiny">${i.note||''}</td>
                <td class="r tiny">${usage} uso${usage===1?'':'s'}</td>
                <td class="r"><div class="row" style="justify-content:flex-end;gap:6px"><button class="btn sm ghost" onclick="editIngredientPrompt('${i.id}')">Editar</button><button class="btn sm danger" onclick="deleteIngredient('${i.id}')">✕</button></div></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
    }).join('')}
  `;
}

function openEditBatchModal(batchId){
  const b = db.batches.find(x=>x.id===batchId);

  if(b.status==='done'){
    if(!confirm('Este lote esta terminado. Editar puede alterar sus datos historicos. Continuar?')) return;
  }
  // Populate _newBatch with existing data — same shape as new batch
  // Extract current salt from first Curado stage as the "override" baseline
  const curedStage = (b.stages||[]).find(s=>s.kind==='Curado' && s.brine);
  const currentCommonSalt = curedStage?.brine?.saltIngredient || null;
  const currentCureSalt = curedStage?.brine?.cureSalt?.ingredient || null;

    editingBatchId: batchId,
    typeId: b.typeId,
    lot: b.lot||'',
    startedAt: toISODate(new Date(b.startedAt)),

    ebPlus20: b.ebPlus20 !== false,
    notes: b.notes||'',
    pieces: b.pieces.map(p=>({
      id: p.id,
      code: p.code,

      thickness: p.thickness,
      shape: p.shape,
      notes: p.notes||''

    saltOverrides: { commonSalt: currentCommonSalt, cureSalt: currentCureSalt, cureSaltSet: true },
    receiving: b.receiving || { coreT:null, provider:'', farm:'', slaughterDate:'', cut:'', acceptance:'pending', notes:'' }
  };
  renderNewBatchModal();
}

/* Salt selector for this batch (overrides the type's default salts).
   Only appears if the type has at least one Curado stage with a brine. */
function renderSaltOverrideSection(type, nb){
  const curadoStages = (type.stages||[]).filter(s=>s.kind==='Curado' && s.brine);
  if(!curadoStages.length) return '';
  const commonSalts = commonSaltIngredients();
  const cureSalts = cureSaltIngredients();
  // Baseline (from type)
  const typeCommon = curadoStages[0].brine.saltIngredient || defaultCommonSaltName();
  const typeCure = curadoStages[0].brine.cureSalt?.ingredient || null;
  // Effective (override or type default)
  const effCommon = nb.saltOverrides?.commonSalt || typeCommon;
  const effCure = nb.saltOverrides?.cureSaltSet
    ? nb.saltOverrides.cureSalt
    : typeCure;
  const commonIng = saltByName(effCommon);
  const cureIng = effCure ? cureSaltByName(effCure) : null;
  // Compute mass on 1 kg reference for both baseline and override so user sees the effect
  const brineTpl = { ...curadoStages[0].brine, saltIngredient: effCommon,
                     cureSalt: {...(curadoStages[0].brine.cureSalt||{ingredient:null, gPerKg:0}),
                                ingredient: effCure} };
  const demo = calcEqBrine(1000, brineTpl.saltPct, brineTpl.waterPct, effCommon, brineTpl);
  const commonChanged = effCommon !== typeCommon;
  const cureChanged = effCure !== typeCure;
  return `
    <div class="divider-lbl">Sales para Este Lote</div>
    <div class="salt-picker">
      <div class="salt-picker-hint tiny">
        La receta define un objetivo de <b>${brineTpl.saltPct}% NaCl</b>. Podes elegir otra sal para este lote:
        el peso en gramos se ajusta segun la densidad de cada sal, pero el NaCl efectivo sobre la carne no cambia.
      </div>
      <div class="salt-picker-grid">
        <div class="salt-picker-cell">
          <label class="bv-lbl-mini">Sal Comun ${commonChanged?`<span class="chg-tag">modificada</span>`:''}</label>
          ${commonSalts.length ? `<select onchange="window._newBatch.saltOverrides.commonSalt=this.value;renderNewBatchModal()">
            ${commonSalts.map(st=>`<option value="${escapeAttr(st.name)}" ${effCommon===st.name?'selected':''}>${st.name} &middot; ${(+st.gPerTsp||6)} g/tsp</option>`).join('')}
          </select>` : '<div class="tiny">Sin sales comunes en el catalogo</div>'}
          <div class="tiny sp-baseline">Receta usa: <b>${typeCommon}</b>${commonChanged?` &rarr; <b style="color:var(--brand)">${effCommon}</b>`:''}</div>
          ${commonIng ? `<div class="sp-preview">
            <span class="sp-item"><b>${fmt(demo.commonG,2)}</b> g</span>
            <span class="sp-op">=</span>
            <span class="sp-item"><b>${fmt(demo.commonTsp,2)}</b> tsp</span>
          </div>` : ''}
        </div>
        <div class="salt-picker-cell">
          <label class="bv-lbl-mini">Sal de Cura ${cureChanged?`<span class="chg-tag">modificada</span>`:''}</label>
          ${cureSalts.length ? `<select onchange="window._newBatch.saltOverrides.cureSalt=this.value||null;window._newBatch.saltOverrides.cureSaltSet=true;renderNewBatchModal()">
            <option value="" ${!effCure?'selected':''}>&mdash; Sin sal de cura &mdash;</option>
            ${cureSalts.map(cs=>`<option value="${escapeAttr(cs.name)}" ${effCure===cs.name?'selected':''}>${cs.name}</option>`).join('')}
          </select>` : '<div class="tiny">Sin sales de cura en el catalogo</div>'}
          <div class="tiny sp-baseline">Receta usa: <b>${typeCure||'ninguna'}</b>${cureChanged?` &rarr; <b style="color:var(--brand)">${effCure||'ninguna'}</b>`:''}</div>
          ${cureIng && demo.cureG>0 ? `<div class="sp-preview">
            <span class="sp-item"><b>${fmt(demo.cureG,2)}</b> g</span>
            <span class="sp-op">=</span>
            <span class="sp-item"><b>${fmt(demo.cureTsp,3)}</b> tsp</span>
          </div>
          <div class="tiny" style="color:var(--muted)">Aporta ${fmt(demo.nitritePpm,0)} ppm nitrito${demo.nitratePpm>0?` &middot; ${fmt(demo.nitratePpm,0)} ppm nitrato`:''}</div>` : ''}
        </div>
      </div>
    </div>
  `;
}
function renderEstimatedTimeline(type, nb){
  const maxThickness = Math.max(...nb.pieces.map(p=>+p.thickness||0), 1);
  const shape = nb.pieces[0]?.shape || 'tubular';
  const plus20 = nb.ebPlus20 !== false;
  let cursor = parseLocalDate(nb.startedAt);
  const rows = [];
  let total = 0;
  for(const s of type.stages){
    let d = s.dEst;
    if(s.kind==='Curado' && s.eb) d = ebDays(maxThickness, shape, plus20);
    const end = addDays(cursor, d);
    rows.push({ kind:s.kind, start: new Date(cursor), end: new Date(end), days: d });
    cursor = new Date(end);
    total += d;
  }
  return `<table style="margin-top:6px">
    <thead><tr><th>Etapa</th><th>Inicio</th><th>Fin</th><th class="r">Días</th></tr></thead>
    <tbody>
      ${rows.map(r=>`<tr>
        <td><span class="sd ${r.kind}"></span> ${r.kind}</td>
        <td class="mono tiny">${fmtDate(r.start)}</td>
        <td class="mono tiny">${fmtDate(r.end)}</td>
        <td class="r mono">${fmt(r.days,1)}</td>
      </tr>`).join('')}
      <tr><td colspan="3" style="text-align:right;font-weight:600">Total del ciclo</td><td class="r mono" style="color:var(--brand);font-weight:600">${Math.round(total)} d (${(total/30).toFixed(1)} m)</td></tr>
    </tbody>
  </table>`;
}

function renderScaledRecipes(type, totalKg, pieces, saltOverrides){
  const stages = type.stages.filter(s=>
    (s.recipe && s.recipe.length) ||
    (s.kind==='Curado' && s.brine) ||
    (s.inoc)
  );
  if(!stages.length) return '<div class="tiny">Ningún ingrediente en esta receta.</div>';
  const meatG = totalKg * 1000;

  return stages.map(s=>{
    let brineRows = '';
    let brineTotalMixG = 0;
    if(s.kind==='Curado' && s.brine){
      // Apply salt overrides for this batch
      const effCommon = saltOverrides?.commonSalt || s.brine.saltIngredient;
      const effCure = saltOverrides?.cureSaltSet
        ? saltOverrides.cureSalt
        : (s.brine.cureSalt?.ingredient||null);
      const effBrine = { ...s.brine, saltIngredient: effCommon,
                         cureSalt: {...(s.brine.cureSalt||{ingredient:null, gPerKg:0}), ingredient: effCure} };
      const rB = calcEqBrine(meatG, effBrine.saltPct, effBrine.waterPct, effCommon, effBrine);
      brineTotalMixG = rB.commonG + rB.cureG;
      brineRows += `<div class="rt auto-row"><span class="n">${effCommon||'Sal comun'} <span class="auto-badge">EQ Brine</span></span><span class="a">${fmt(rB.commonG,2)}<span class="u">g</span> <span class="tiny">(${fmt(rB.commonTsp,1)} tsp)</span></span></div>`;
      if(rB.cureG>0 && rB.cureIng){
        brineRows += `<div class="rt auto-row"><span class="n">${rB.cureIng.name} <span class="auto-badge">EQ Brine</span></span><span class="a">${fmt(rB.cureG,2)}<span class="u">g</span> <span class="tiny">(${fmt(rB.cureTsp,3)} tsp)</span></span></div>`;
      }
      if(rB.waterG>0){
        brineRows += `<div class="rt auto-row"><span class="n">Agua destilada <span class="auto-badge">EQ Brine</span></span><span class="a">${fmt(rB.waterG,0)}<span class="u">ml</span></span></div>`;
      }
    }

    let recipeRows = '';
    let recipeMixG = 0;
    (s.recipe||[]).forEach(r=>{
      const ing = db.ingredients.find(i=>i.name===r.ingredient);
      const amt = r.amount * totalKg;
      const unit = (ing?.unit||'g');
      if(unit==='g' || !unit) recipeMixG += amt;
      recipeRows += `<div class="rt"><span class="n">${r.ingredient}</span><span class="a">${fmt(amt,2)}<span class="u">${unit}</span></span></div>`;
    });

    let inocRow = '';
    if(s.inoc){
      const cultIng = db.ingredients.find(x=>x.name===s.inoc.i);
      const scaled = cultIng ? scaleInoculant(cultIng, totalKg) : null;
      if(scaled){
        inocRow = `<div class="rt" style="color:var(--sage)"><span class="n">&#10022; ${s.inoc.i} + ${fmt(scaled.waterMl,0)} ml agua destilada</span><span class="a">${fmtFrac(scaled.starterTsp)}<span class="u">tsp</span></span></div>`;
      } else {
        inocRow = `<div class="rt" style="color:var(--sage)"><span class="n">&#10022; ${s.inoc.i} + ${fmt((s.inoc.water||0)*totalKg,1)}ml agua</span><span class="a">${fmt((s.inoc.a||0)*totalKg,3)}<span class="u">g</span></span></div>`;
      }
    }

    // Mix per piece: for Curado stages, show how much of the total mix (salt+cure+spices)
    // each piece should receive, proportional to its weight
    let mixPerPiece = '';
    const totalMixG = brineTotalMixG + recipeMixG;
    if(pieces && pieces.length > 0 && totalMixG > 0 && s.kind==='Curado'){
      mixPerPiece = `
        <div class="mix-per-piece">
          <div class="mpp-hd"><b>Distribucion del mix por pieza</b> <span class="tiny">(total ${fmt(totalMixG,2)} g de mix seco)</span></div>
          <div class="mpp-list">
            ${pieces.map((p,i)=>{
              const pieceKg = (+p.initialWeight||0)/1000;
              const share = pieceKg/totalKg;
              const pieceMixG = totalMixG * share;
              return `<div class="mpp-row">
                <span class="mpp-idx">P${i+1}</span>

function createBatch(){
  const nb = window._newBatch;
  const type = db.types.find(t=>t.id===nb.typeId);
  if(!type){ toast('Selecciona un tipo'); return; }
  if(nb.pieces.length===0){ toast('Agrega al menos una pieza'); return; }

  // Edit mode: update existing batch instead of creating a new one
  if(nb.editingBatchId){
    const b = db.batches.find(x=>x.id===nb.editingBatchId);
    if(b){
      b.lot = nb.lot;
      b.notes = nb.notes;
      b.targetYield = nb.targetYield;
      b.ebPlus20 = nb.ebPlus20;
      if(nb.receiving) b.receiving = nb.receiving;
      // Merge pieces: preserve existing weightLogs by matching piece.id
      const existingById = {}; b.pieces.forEach(p=>{ existingById[p.id] = p; });
      b.pieces = nb.pieces.map((p, i)=>{
        const existing = p.id ? existingById[p.id] : null;
        const code = p.code || (b.ref + String.fromCharCode(65+i));
        return {
          id: p.id || uid('pc'),
          code,
          initialWeight: +p.initialWeight,
          thickness: +p.thickness,
          shape: p.shape,
          notes: p.notes||'',
          weightLogs: existing ? (existing.weightLogs||[]) : []
        };
      });
      // Recompute stage timeline based on possibly-changed thickness and start date.
      // Use parseLocalDate to avoid UTC timezone shift.
      const maxThickness = Math.max(...b.pieces.map(p=>+p.thickness||0), 1);
      const shape = b.pieces[0]?.shape || 'tubular';
      const plus20 = b.ebPlus20 !== false;
      const startLocal = parseLocalDate(nb.startedAt);
      let cursor = new Date(startLocal);
      b.startedAt = startLocal.toISOString();
      b.stages.forEach(s=>{
        let d = s.dEst;
        const typeStage = type.stages.find(ts => ts.kind === s.kind);
        if(s.kind==='Curado' && (s.eb || (typeStage && typeStage.eb))){
          d = ebDays(maxThickness, shape, plus20);
          s.dEst = d;
        }
        // Apply salt overrides to any Curado brine on this batch
        if(s.kind==='Curado' && s.brine){
          if(nb.saltOverrides?.commonSalt) s.brine.saltIngredient = nb.saltOverrides.commonSalt;
          if(nb.saltOverrides?.cureSaltSet){
            if(!s.brine.cureSalt) s.brine.cureSalt = { ingredient:null, gPerKg:0 };
            s.brine.cureSalt.ingredient = nb.saltOverrides.cureSalt;
          }
        }
        // Only reset dates for stages not yet done
        if(!s.done){
          s.startedAt = new Date(cursor).toISOString();
          const end = addDays(cursor, d);
          s.expectedEnd = new Date(end).toISOString();
          cursor = new Date(end);
        } else {
          cursor = parseLocalDate(s.actualEnd || s.expectedEnd);
        }
      });
      saveDB();
      closeModal();
      render();
      toast('Lote '+b.ref+' actualizado');
      return;
    }
  }

  const ref = nextRefFor(type.ref);
  const maxThickness = Math.max(...nb.pieces.map(p=>+p.thickness||0), 1);
  const shape = nb.pieces[0]?.shape || 'tubular';
  const plus20 = nb.ebPlus20 !== false;
  let cursor = parseLocalDate(nb.startedAt);
  const stages = type.stages.map(s=>{
    let d = s.dEst;
    if(s.kind==='Curado' && s.eb) d = ebDays(maxThickness, shape, plus20);
    const startedAt = new Date(cursor).toISOString();
    const expectedEnd = addDays(cursor, d);
    cursor = new Date(expectedEnd);
    // Deep-copy brine (with nested cureSalt) to avoid mutating the type when the batch is edited.
    // Apply per-batch salt overrides if set.
    let brineCopy = null;
    if(s.brine){
      brineCopy = {
        saltPct: s.brine.saltPct,
        waterPct: s.brine.waterPct,
        saltIngredient: (nb.saltOverrides?.commonSalt) || s.brine.saltIngredient,
        cureSalt: s.brine.cureSalt ? { ...s.brine.cureSalt } : { ingredient:null, gPerKg:0 }
      };
      if(nb.saltOverrides?.cureSaltSet){
        brineCopy.cureSalt.ingredient = nb.saltOverrides.cureSalt;
      }
    } else if(s.kind==='Curado'){
      brineCopy = {
        saltPct: 2.8,
        waterPct: 0,
        saltIngredient: (nb.saltOverrides?.commonSalt) || defaultCommonSaltName(),
        cureSalt: { ingredient: (nb.saltOverrides?.cureSalt)||null, gPerKg:0 }
      };
    }
    return {
      kind: s.kind,
      shape: s.shape || null,
      eb: s.eb || false,
      startedAt, expectedEnd,
      dEst: d,
      done: false, actualEnd: null,
      brine: brineCopy,
      recipe: (s.recipe||[]).map(r=>({...r})),
      inoc: s.inoc? {...s.inoc} : null,
      env: s.env? {...s.env} : null,
      ph: s.ph? {...s.ph} : null,
      smoke: s.smoke ? { ...s.smoke, woods: (s.smoke.woods||[]).slice() } : null,
      press: s.press||false,
      notes:''
    };
  });

  const batch = {
    id: uid('bat'),
    ref, lot: nb.lot,
    typeId: type.id, typeName: type.name, typeRef: type.ref,
    ebPlus20: plus20,
    status:'in_progress',
    startedAt: parseLocalDate(nb.startedAt).toISOString(),
    targetYield: nb.targetYield,
    pieces: nb.pieces.map((p,i)=>({
      id: uid('pc'),
      code: ref + String.fromCharCode(65+i),
      initialWeight:+p.initialWeight,
      thickness:+p.thickness,
      shape:p.shape,
      notes:p.notes||'',
      weightLogs: []
    })),
    stages,
    phLogs: [],
    receiving: nb.receiving || null,
    envLog: [],
    tasting: null,
    notes: nb.notes || ''
  };
  db.batches.push(batch);
  saveDB(); closeModal(); goto('batch-detail',{batchId:batch.id}); toast('Lote '+ref+' creado');
}

/* Stage completion */
function completeStage(batchId, idx){
  const b = db.batches.find(x=>x.id===batchId);
  const s = b.stages[idx];
  s.done = true;
  s.actualEnd = new Date().toISOString();
  // shift downstream stages to start now
  const now = new Date();
  let cursor = now;
  for(let i=idx+1;i<b.stages.length;i++){
    const ns = b.stages[i];
    ns.startedAt = new Date(cursor).toISOString();
    ns.expectedEnd = addDays(cursor, ns.dEst);
    cursor = new Date(ns.expectedEnd);
  }
  // if all done, mark batch done
  if(b.stages.every(s=>s.done)){ b.status='done'; b.finishedAt=new Date().toISOString(); }
  saveDB(); render(); toast('Etapa completada');
}

function phSafetyVerdict(ph, ctx){
  // Charcuterie fermentation logic (adapted from botulism/acidification science).
  // ctx: {start,end,dangerLow,dangerHigh}
  // Key thresholds for fermented sausage:
  //   pH must drop to <= 5.3 reasonably fast to control C. botulinum / pathogens.
  //   Typical finished fermented product target 4.6–5.3.
  //   pH < dangerLow (over-acid, cultures stalled/spoiled) or > dangerHigh (unsafe, not acidifying).
  if(ph===null || ph===undefined || isNaN(ph)) return null;
  const dl = ctx.dangerLow, dh = ctx.dangerHigh;
  if(ph > dh){
    return { level:'danger', icon:'☠',
      title:`pH ${ph} — PELIGRO: no ha acidificado`,
      desc:`Por encima de ${dh} el producto no alcanzó la barrera ácida. Riesgo de crecimiento de patógenos (C. botulinum, Salmonella, S. aureus). Si ya pasaron las horas críticas de fermentación sin bajar de 5.3, considere descartar el lote.` };
  }
  if(ph < dl){
    return { level:'danger', icon:'⚠',
      title:`pH ${ph} — Sobre-acidificado`,
      desc:`Por debajo de ${dl} el cultivo acidificó en exceso. Sabor demasiado ácido y textura afectada. No es un riesgo de botulismo, pero revise dosis de dextrosa/cultivo y temperatura.` };
  }
  if(ph <= 4.6){
    return { level:'safe', icon:'✓',
      title:`pH ${ph} — Barrera ácida sólida`,
      desc:`Por debajo de 4.6 se inhibe C. botulinum y la mayoría de patógenos. Producto estable para secado y madurado.` };
  }
  if(ph <= 5.3){
    return { level:'safe', icon:'✓',
      title:`pH ${ph} — En rango seguro de fermentado`,
      desc:`Entre 4.6 y 5.3 es el rango típico de un embutido fermentado bien acidificado. Combinado con la pérdida de humedad (aw) garantiza estabilidad.` };
  }
  // 5.3 < ph <= dangerHigh
  return { level:'caution', icon:'△',
    title:`pH ${ph} — Zona de vigilancia`,
    desc:`Entre 5.3 y ${dh}. Aún no cruza la barrera de 5.3. Vigile de cerca: debe seguir bajando. Si se estanca aquí, revise temperatura, humedad y actividad del cultivo.` };
}

function phRecommendations(ph, ctx){
  const recos = [];
  if(ph===null||ph===undefined||isNaN(ph)) return recos;
  if(ph > 5.3){
    recos.push('Verifique temperatura de fermentación (los cultivos meso/termófilos necesitan su rango exacto).');
    recos.push('Confirme dosis de dextrosa: es el "combustible" que las bacterias convierten en ácido láctico.');
    recos.push('Revise que el cultivo estuviera activo (rehidratado en agua no clorada, no vencido).');
  }
  if(ph > ctx.dangerHigh){
    recos.push('Si superó las horas críticas sin bajar de 5.3, aplique la regla de "degree-hours" y evalúe descarte.');
    recos.push('No avance a secado hasta acidificar; el secado sin barrera ácida es riesgoso.');
  }
  if(ph < ctx.dangerLow){
    recos.push('Reduzca dextrosa o tiempo de fermentación en el próximo lote.');
    recos.push('Baje ligeramente la temperatura para frenar la producción de ácido.');
  }
  if(ph>=4.6 && ph<=5.3){
    recos.push('Rango ideal alcanzado: puede pasar a secado/madurado según cronograma.');
    recos.push('Registre el pH final para trazabilidad del lote.');
  }
  recos.push('Mida a temperatura ambiente con pHmetro calibrado (buffers 4.0 y 7.0); las tiras no son confiables.');
  return recos;
}

function renderPhModal(batchId, stageIdx){
  const b = db.batches.find(x=>x.id===batchId);
  const s = b.stages[stageIdx];
  const existing = (b.phLogs||[]).find(p=>p.stageIdx===stageIdx) || {};
  const ctx = s.ph;
  const draft = window._phDraft;
  const liveVal = draft.end ?? draft.start;
  const verdict = phSafetyVerdict(liveVal, ctx);
  const recos = phRecommendations(liveVal, ctx);

  // scale 3.5 .. 7.0 for marker positioning
  const lo=3.5, hi=7.0;
  const pos = (v)=> Math.max(0,Math.min(100, ((v-lo)/(hi-lo))*100));

  showModal(`

function savePh(batchId, stageIdx){
  const b = db.batches.find(x=>x.id===batchId);

  const sVal = document.getElementById('ph-s').value;
  const eVal = document.getElementById('ph-e').value;

    stageIdx,
    phStart: sVal===''? null : parseFloat(sVal),
    phEnd: eVal===''? null : parseFloat(eVal),
    note: document.getElementById('ph-n').value
  };
  if(existing) Object.assign(existing, data);
  else b.phLogs.push(data);

function finishBatch(id){
  const b = db.batches.find(x=>x.id===id);
  if(!confirm(`¿Marcar lote ${b.ref} como terminado?`)) return;
  b.status='done'; b.finishedAt=new Date().toISOString();
  b.stages.forEach(s=>{ if(!s.done){ s.done=true; s.actualEnd=new Date().toISOString(); } });
  saveDB(); render(); toast('Lote terminado · abrí la cata cuando quieras');
  // Immediately prompt for tasting panel (optional but encouraged)
  setTimeout(()=>openTastingModal(id), 200);
